<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>{{SESSION_NAME}} — Codex Remote Hub Mobile</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: rgba(18, 19, 26, 0.96);
    --surface-2: #11131b;
    --surface-3: #171a24;
    --border: #262936;
    --text: #ece9e2;
    --text-dim: #928f86;
    --accent: #10a37f;
    --accent-2: #13b48d;
    --danger: #ef4444;
    --success: #4ade80;
    --shadow: 0 14px 40px rgba(0, 0, 0, 0.32);
    --radius: 18px;
    --mono: 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --header-h: 58px;
    --composer-h: 152px;
    --app-height: 100dvh;
    --input-h: 40px;
    --icon-btn-h: 45px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
    width: 100%;
    max-width: 100%;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    overflow-x: hidden;
  }

  body {
    height: var(--app-height);
    overflow: hidden;
  }

  a { color: inherit; }

  .app {
    height: var(--app-height);
    width: 100%;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(circle at top left, rgba(16, 163, 127, 0.08), transparent 28%),
      radial-gradient(circle at top right, rgba(255, 255, 255, 0.03), transparent 22%),
      var(--bg);
  }

  .header {
    height: calc(var(--header-h) + env(safe-area-inset-top));
    padding: calc(env(safe-area-inset-top) + 8px) 14px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: linear-gradient(180deg, rgba(10, 10, 15, 0.98), rgba(10, 10, 15, 0.92));
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .back-btn,
  .ghost-btn,
  .chip-btn,
  .send-btn,
  .icon-btn {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 12px;
    font: 600 14px/1 var(--sans);
    -webkit-tap-highlight-color: transparent;
  }

  .back-btn,
  .icon-btn {
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }

  .session-wrap {
    min-width: 0;
  }

  .session-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    min-width: 0;
  }

  .session-name {
    font: 700 16px/1.1 var(--mono);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .session-updated {
    flex-shrink: 0;
    font: 600 11px/1 var(--sans);
    color: var(--text-dim);
    white-space: nowrap;
  }

  .session-meta {
    margin-top: 4px;
    font: 500 12px/1.2 var(--sans);
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
    text-align: right;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 12px 12px 0;
    gap: 10px;
    overflow: hidden;
  }

  .viewport {
    flex: 1;
    min-height: 0;
    border: 1px solid rgba(255, 255, 255, 0.06);
    background: rgba(10, 11, 16, 0.85);
    border-radius: 22px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .pane-wrap {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 14px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    overscroll-behavior-x: none;
    touch-action: pan-y;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
  }

  .pane-wrap::-webkit-scrollbar {
    width: 8px;
  }

  .pane-wrap::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 999px;
  }

  .pane {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
    font: 500 14px/1.5 var(--mono);
    color: #eeece6;
    min-height: min-content;
  }

  .pane-empty {
    color: var(--text-dim);
  }

  .composer-shell {
    padding: 8px 12px calc(env(safe-area-inset-bottom) + 10px);
    background: linear-gradient(180deg, rgba(10, 10, 15, 0), rgba(10, 10, 15, 0.86) 10%, rgba(10, 10, 15, 0.98) 30%);
    flex-shrink: 0;
    width: 100%;
    max-width: 100%;
    overflow: hidden;
  }

  .composer {
    border: 1px solid rgba(255, 255, 255, 0.06);
    background: var(--surface);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 9px;
    display: grid;
    gap: 8px;
    width: 100%;
    max-width: 100%;
    overflow: hidden;
    margin-top: 5px;
  }

  .smart-actions-shell {
    display: grid;
    gap: 8px;
  }

  .smart-actions-shell.hidden {
    display: none;
  }

  .smart-actions-label {
    font: 700 11px/1 var(--mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .smart-actions-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .smart-actions-row::-webkit-scrollbar {
    display: none;
  }

  .tool-row,
  .nav-row,
  .input-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .input-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    min-width: 0;
    gap: 0px;
    width: 100%;
    max-width: 100%;
  }

  .controls-shell {
    display: grid;
    gap: 4px;
    width: 100%;
    max-width: 100%;
  }

  .controls-toggle-row {
    display: flex;
    align-items: center;
    justify-content: flex-start;
  }

  .controls-toggle {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--text-dim);
    font: 700 11px/1 var(--mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    justify-content: flex-start;
    gap: 4px;
    -webkit-tap-highlight-color: transparent;
    margin-top: 5px;
    margin-bottom: 5px;
    margin-left: 5px;
  }

  .controls-toggle .chevron {
    display: inline-block;
    transition: transform 0.18s ease;
    font: 700 11px/1 var(--mono);
  }

  .controls-shell.collapsed .controls-toggle .chevron {
    transform: rotate(90deg);
  }

  .controls-shell.collapsed {
    gap: 0;
  }

  .controls-body {
    display: grid;
    gap: 8px;
  }

  .controls-shell.collapsed .controls-body {
    display: none;
  }

  .tool-row,
  .nav-row {
    overflow-x: auto;
    scrollbar-width: none;
  }

  .tool-row::-webkit-scrollbar,
  .nav-row::-webkit-scrollbar {
    display: none;
  }

  .chip-btn,
  .ghost-btn {
    height: 36px;
    padding: 0 11px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .ghost-btn {
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
  }

  .danger-btn {
    color: #ffd6d6;
    border-color: rgba(239, 68, 68, 0.35);
    background: rgba(239, 68, 68, 0.1);
  }

  .enter-btn,
  .send-btn {
    border-color: rgba(16, 163, 127, 0.45);
    background: rgba(16, 163, 127, 0.18);
    color: #dffff5;
  }

  .mic-btn.listening {
    border-color: rgba(16, 163, 127, 0.45);
    background: rgba(16, 163, 127, 0.18);
    color: #dffff5;
  }

  .icon-action-btn {
    width: var(--icon-btn-h);
    height: var(--icon-btn-h);
    min-width: var(--icon-btn-h);
    padding: 0 !important;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    background: transparent;
    box-shadow: none;
  }

  .composer-input {
    flex: 1;
    width: 100%;
    min-width: 0;
    min-height: var(--input-h);
    max-height: 84px;
    resize: none;
    border: 1px solid rgba(255, 255, 255, 0.96);
    background: #0e1017;
    border-radius: 10px;
    color: var(--text);
    padding: 10px 11px;
    font: 500 15px/1.35 var(--sans);
    outline: none;
    transition: border-color 0.16s ease, box-shadow 0.16s ease;
  }

  .composer-input:focus {
    border-color: rgba(255, 255, 255, 0.96);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.96);
  }

  .send-btn {
    height: var(--icon-btn-h);
    min-width: var(--icon-btn-h);
    padding: 0;
    font-size: 13px;
  }

  .mic-btn {
    height: var(--icon-btn-h);
    min-width: var(--icon-btn-h);
    padding: 0;
    font-size: 13px;
  }

  .btn-icon {
    width: 78%;
    height: 78%;
    display: block;
    fill: currentColor;
    opacity: 0.95;
    pointer-events: none;
    margin: 0;
  }

  @media (max-width: 699px) {
    .main {
      padding: 8px 8px 0;
      gap: 6px;
    }

    .viewport {
      border-radius: 18px;
    }

    .pane-wrap {
      padding: 10px;
    }

    .composer-shell {
      padding: 0;
    }

    .composer {
      margin: 5px 2px 0;
      padding: 4px;
      gap: 3px;
      border-radius: 16px;
    }

    .input-row {
      grid-template-columns: minmax(0, 1fr) 45px 45px;
      gap: 2px;
    }

  }

  body.keyboard-open .header {
    display: none;
  }

  body.keyboard-open .session-meta {
    display: none;
  }

  body.keyboard-open .main {
    padding-top: 4px;
  }

  body.keyboard-open .pane-wrap {
    padding: 8px 10px;
  }

  body.keyboard-open .controls-shell {
    display: none;
  }

  body.keyboard-open .controls-body {
    display: none;
  }

  body.keyboard-open .composer-shell {
    padding: 0;
  }

  .tablet-grid {
    display: contents;
  }

  @media (min-width: 700px) {
    :root {
      --composer-h: 154px;
    }

    .main {
      padding: 18px 18px 0;
      gap: 14px;
    }

    .viewport {
      border-radius: 26px;
    }

    .pane-wrap {
      padding: 20px;
    }

    .pane {
      font-size: 14px;
      line-height: 1.5;
    }

    .composer-shell {
      padding: 12px 18px calc(env(safe-area-inset-bottom) + 14px);
    }

    .composer {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "tools tools"
        "nav nav"
        "input input";
      align-items: stretch;
      padding: 12px;
    }

    .tool-row { grid-area: tools; }
    .nav-row { grid-area: nav; }
    .input-row { grid-area: input; }

    .composer-input {
      min-height: 64px;
      max-height: 132px;
      font-size: 17px;
    }

    .send-btn {
      min-width: 90px;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <a class="back-btn" href="/" aria-label="Back to sessions">&#8249;</a>
        <div class="session-wrap">
          <div class="session-top">
            <div class="session-name">{{SESSION_NAME}}</div>
            <div class="session-updated" id="status-text">--:--:--</div>
          </div>
          <div class="session-meta" id="cwd-label">Connecting…</div>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="viewport">
        <div class="pane-wrap" id="pane-wrap">
          <pre class="pane pane-empty" id="pane">Loading terminal output…</pre>
        </div>
      </section>
    </main>

    <div class="composer-shell">
      <section class="composer">
        <div class="controls-shell" id="controls-shell">
          <div class="controls-toggle-row">
            <button type="button" class="controls-toggle" id="controls-toggle" aria-expanded="true" aria-label="Collapse controls">
              <span>Controls</span>
              <span class="chevron">⌃</span>
            </button>
          </div>
          <div class="controls-body">
        <div class="tool-row">
          <button class="chip-btn" data-key="Escape">Esc</button>
          <button class="chip-btn" data-key="Tab">Tab</button>
          <button class="chip-btn danger-btn" data-key="C-c">^C</button>
          <button class="chip-btn" data-action="paste">Paste</button>
              <button class="chip-btn enter-btn" data-key="Enter">Enter</button>
            </div>

            <div class="nav-row">
              <button class="chip-btn" data-key="Left">Left</button>
              <button class="chip-btn" data-key="Up">Up</button>
              <button class="chip-btn" data-key="Down">Down</button>
              <button class="chip-btn" data-key="Right">Right</button>
              <button class="chip-btn" data-scroll="up">PgUp</button>
              <button class="chip-btn" data-scroll="down">PgDn</button>
            </div>
          </div>
        </div>

        <div class="smart-actions-shell hidden" id="smart-actions-shell">
          <div class="smart-actions-label">Suggested actions</div>
          <div class="smart-actions-row" id="smart-actions-row"></div>
        </div>

        <div class="input-row">
          <textarea id="composer-input" class="composer-input" rows="1" aria-label="Send text to Codex"></textarea>
          <button id="mic-btn" class="ghost-btn mic-btn icon-action-btn" type="button" aria-label="Microphone">
            <svg class="btn-icon" viewBox="0 0 2.271 2.271" aria-hidden="true">
              <path d="M2.271,1.135c0,0.626 -0.509,1.135 -1.136,1.135c-0.626,-0 -1.135,-0.509 -1.135,-1.135c0,-0.626 0.509,-1.135 1.135,-1.135c0.627,0 1.136,0.509 1.136,1.135Zm-0.821,-0.142l-0,0.153c-0,0.184 -0.132,0.317 -0.315,0.317c-0.182,-0 -0.314,-0.133 -0.314,-0.317l0,-0.153c0,-0.035 -0.029,-0.068 -0.066,-0.068c-0.035,0 -0.067,0.033 -0.067,0.068l-0,0.153c-0,0.236 0.152,0.411 0.379,0.44l0,0.094l-0.226,0c-0.037,0 -0.07,0.033 -0.07,0.069c-0,0.038 0.033,0.068 0.07,0.068l0.591,-0c0.035,-0 0.067,-0.031 0.067,-0.068c0,-0.036 -0.031,-0.069 -0.067,-0.069l-0.227,0l0,-0.094c0.227,-0.031 0.377,-0.204 0.377,-0.44l0,-0.153c0,-0.035 -0.031,-0.068 -0.066,-0.068c-0.037,0 -0.066,0.033 -0.066,0.068Zm-0.504,-0.326l0,0.486c0,0.115 0.078,0.203 0.189,0.203c0.111,-0 0.19,-0.088 0.19,-0.203l-0,-0.486c-0,-0.116 -0.079,-0.2 -0.19,-0.2c-0.111,-0 -0.189,0.084 -0.189,0.2Z"/>
            </svg>
          </button>
          <button id="send-btn" class="send-btn icon-action-btn" type="button" aria-label="Send">
            <svg class="btn-icon" viewBox="0 0 2.271 2.271" aria-hidden="true">

            </svg>
          </button>
        </div>
      </section>
    </div>
  </div>

<script>
  var SESSION = "{{SESSION_NAME}}";
  var paneWrap = document.getElementById('pane-wrap');
  var pane = document.getElementById('pane');
  var cwdLabel = document.getElementById('cwd-label');
  var input = document.getElementById('composer-input');
  var micBtn = document.getElementById('mic-btn');
  var sendBtn = document.getElementById('send-btn');
  var statusText = document.getElementById('status-text');
  var composerShell = document.querySelector('.composer-shell');
  var controlsShell = document.getElementById('controls-shell');
  var controlsToggle = document.getElementById('controls-toggle');
  var smartActionsShell = document.getElementById('smart-actions-shell');
  var smartActionsRow = document.getElementById('smart-actions-row');
  var lastText = "";
  var lastCursorY = null;
  var pollTimer = null;
  var hasLoadedOnce = false;
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var recognition = null;
  var recognitionBaseText = '';
  var recognitionListening = false;

  function isKeyboardOpen() {
    if (!window.visualViewport) return false;
    return (window.innerHeight - window.visualViewport.height) > 120;
  }

  function syncViewportHeight() {
    var keyboardOpen = isKeyboardOpen();
    var height = keyboardOpen && window.visualViewport
      ? window.visualViewport.height
      : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', Math.round(height) + 'px');
    document.body.classList.toggle('keyboard-open', keyboardOpen);
    if (composerShell) {
      document.documentElement.style.setProperty('--composer-h', composerShell.offsetHeight + 'px');
    }
  }

  function autoResize() {
    var minHeight = parseFloat(getComputedStyle(input).minHeight) || 0;
    input.style.height = '0px';
    var targetHeight = !input.value.trim()
      ? minHeight
      : Math.min(input.scrollHeight, window.innerWidth >= 700 ? 132 : 84);
    input.style.height = targetHeight + 'px';
    syncViewportHeight();
  }

  function setUpdatedTime(timestamp) {
    if (!statusText) return;
    if (!timestamp) {
      statusText.textContent = '--:--:--';
      return;
    }
    statusText.textContent = new Date(timestamp).toLocaleTimeString([], {
      hour: 'numeric',
      minute: '2-digit',
      second: '2-digit'
    });
  }

  function showStatus(message) {
    if (window.console && message) {
      console.debug(message);
    }
  }

  function setControlsCollapsed(collapsed) {
    if (!controlsShell || !controlsToggle) return;
    controlsShell.classList.toggle('collapsed', collapsed);
    controlsToggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    controlsToggle.setAttribute('aria-label', collapsed ? 'Expand controls' : 'Collapse controls');
    try {
      localStorage.setItem('codex-mobile-controls-collapsed', collapsed ? '1' : '0');
    } catch (err) {}
    syncViewportHeight();
  }

  function formatPathTail(path) {
    if (!path) return 'No working directory';
    var parts = path.split('/').filter(Boolean);
    if (!parts.length) return path;
    var tail = parts.slice(-2).join('/');
    return parts.length > 2 ? '…/' + tail : tail;
  }

  function makeAction(label, steps, primary) {
    return { label: label, steps: steps, primary: !!primary };
  }

  function extractSmartActions(text, cursorY) {
    if (!text) return [];

    var rawLines = text.split(/\r?\n/);
    var endLine = typeof cursorY === 'number' && cursorY >= 0
      ? Math.min(rawLines.length, cursorY + 1)
      : rawLines.length;
    var startLine = typeof cursorY === 'number' && cursorY >= 0
      ? Math.max(0, endLine - 8)
      : 0;
    var scopedLines = rawLines.slice(startLine, endLine);
    var scopedText = scopedLines.join('\n');

    var trimmedLines = scopedLines
      .map(function(line) { return line.trim(); })
      .filter(Boolean);

    var options = trimmedLines
      .map(function(line) {
        var match = line.match(/^([›>])?\s*([0-9]+|[A-Za-z])[.)]\s+(.+)$/);
        if (!match) return null;
        return {
          selected: !!match[1],
          token: match[2],
          label: match[3].trim()
        };
      })
      .filter(Boolean);

    var pressEnter = /press enter to continue/i.test(scopedText);
    if (options.length >= 2 && options.length <= 5) {
      return options.slice(0, 4).map(function(option, index) {
        return makeAction(
          option.token + '. ' + option.label,
          [{ text: option.token }, { key: 'Enter' }],
          option.selected || index === 0
        );
      });
    }

    var yesNoMatch = scopedText.match(/[\[(]([YyNn])\/([YyNn])[\])]/);
    if (yesNoMatch) {
      var first = yesNoMatch[1].toLowerCase();
      var second = yesNoMatch[2].toLowerCase();
      return [
        makeAction(first === 'y' ? 'Yes' : 'No', [{ text: first }, { key: 'Enter' }], true),
        makeAction(second === 'n' ? 'No' : 'Yes', [{ text: second }, { key: 'Enter' }], false)
      ];
    }

    if (pressEnter) {
      return [makeAction('Continue', [{ key: 'Enter' }], true)];
    }

    return [];
  }

  function renderSmartActions(text, cursorY) {
    if (!smartActionsShell || !smartActionsRow) return;

    var actions = extractSmartActions(text, cursorY);
    smartActionsRow.innerHTML = '';

    if (!actions.length) {
      smartActionsShell.classList.add('hidden');
      syncViewportHeight();
      return;
    }

    actions.forEach(function(action) {
      var button = document.createElement('button');
      button.type = 'button';
      button.className = action.primary ? 'chip-btn enter-btn' : 'chip-btn';
      button.textContent = action.label;
      button.addEventListener('click', function() {
        runSteps(action.steps, action.label);
      });
      smartActionsRow.appendChild(button);
    });

    smartActionsShell.classList.remove('hidden');
    syncViewportHeight();
  }

  async function fetchPane(forceStick) {
    try {
      var res = await fetch('/api/pane/' + encodeURIComponent(SESSION) + '?lines=120', {
        cache: 'no-store'
      });
      var data = await res.json();
      if (!data.ok) {
        pane.textContent = 'Session not found. Go back and reopen it.';
        pane.classList.add('pane-empty');
        setUpdatedTime(null);
        renderSmartActions('', null);
        return;
      }

      var nextText = data.text || '';
      var nextCursorY = typeof data.cursor_y === 'number' ? data.cursor_y : null;
      if (nextText !== lastText || nextCursorY !== lastCursorY) {
        pane.textContent = nextText || 'Waiting for terminal output…';
        pane.classList.toggle('pane-empty', !nextText);
        lastText = nextText;
        lastCursorY = nextCursorY;
        renderSmartActions(nextText, nextCursorY);
      }
      cwdLabel.textContent = formatPathTail(data.cwd || '');
      setUpdatedTime(data.updated);
      if (!hasLoadedOnce) {
        paneWrap.scrollTop = 0;
      }
      hasLoadedOnce = true;
    } catch (err) {
      showStatus('Connection issue');
    }
  }

  async function postJson(path, payload) {
    var res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    return res.ok;
  }

  async function runSteps(steps, label) {
    var ok = true;
    for (var i = 0; i < steps.length; i += 1) {
      var step = steps[i];
      if (step.key) {
        ok = await postJson('/api/send-keys/' + encodeURIComponent(SESSION), { key: step.key });
      } else if (typeof step.text === 'string') {
        ok = await postJson('/api/send-text/' + encodeURIComponent(SESSION), { text: step.text });
      }

      if (!ok) break;

      if (i < steps.length - 1) {
        await new Promise(function(resolve) { setTimeout(resolve, 60); });
      }
    }

    showStatus(ok ? 'Sent ' + label : 'Action failed');
    setTimeout(function() { fetchPane(true); }, 140);
    return ok;
  }

  async function sendKey(key) {
    await runSteps([{ key: key }], key);
  }

  async function scrollPane(direction) {
    var ok = await postJson('/api/scroll/' + encodeURIComponent(SESSION), { direction: direction });
    showStatus(ok ? 'Scrolled ' + direction : 'Scroll failed');
    setTimeout(function() { fetchPane(false); }, 120);
  }

  async function sendText(withEnter) {
    var text = input.value;
    if (!text.trim()) {
      if (withEnter) return sendKey('Enter');
      return;
    }

    var ok = await postJson('/api/send-text/' + encodeURIComponent(SESSION), { text: text });
    if (ok && withEnter) {
      ok = await postJson('/api/send-keys/' + encodeURIComponent(SESSION), { key: 'Enter' });
    }

    showStatus(ok ? 'Sent to Codex' : 'Send failed');
    if (ok) {
      input.value = '';
      autoResize();
      input.focus();
      setTimeout(function() { fetchPane(true); }, 120);
    }
  }

  async function pasteClipboard() {
    try {
      var text = await navigator.clipboard.readText();
      if (!text) return;
      input.value += text;
      autoResize();
      input.focus();
    } catch (err) {
      showStatus('Clipboard unavailable');
    }
  }

  function setMicState(listening) {
    recognitionListening = listening;
    if (!micBtn) return;
    micBtn.classList.toggle('listening', listening);
    micBtn.setAttribute('aria-label', listening ? 'Stop microphone' : 'Microphone');
  }

  function initMic() {
    if (!SpeechRecognitionCtor) return;

    recognition = new SpeechRecognitionCtor();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = navigator.language || 'en-US';

    recognition.onstart = function() {
      recognitionBaseText = input.value.trim();
      setMicState(true);
      showStatus('Listening…');
    };

    recognition.onresult = function(event) {
      var transcript = '';
      for (var i = event.resultIndex; i < event.results.length; i += 1) {
        transcript += event.results[i][0].transcript;
      }
      transcript = transcript.trim();
      input.value = recognitionBaseText
        ? recognitionBaseText + (transcript ? ' ' + transcript : '')
        : transcript;
      autoResize();
    };

    recognition.onerror = function() {
      setMicState(false);
      showStatus('Mic unavailable here');
      input.focus();
    };

    recognition.onend = function() {
      setMicState(false);
      input.focus();
      showStatus(input.value.trim()
        ? 'Transcript ready to send'
        : 'Mic stopped');
    };
  }

  function toggleMic() {
    if (!SpeechRecognitionCtor || !recognition) {
      input.focus();
      showStatus('Use the iPhone keyboard mic to dictate');
      return;
    }

    if (recognitionListening) {
      recognition.stop();
      return;
    }

    recognition.start();
  }

  document.querySelectorAll('[data-key]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      sendKey(btn.getAttribute('data-key'));
    });
  });

  document.querySelectorAll('[data-scroll]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      scrollPane(btn.getAttribute('data-scroll'));
    });
  });

  document.querySelectorAll('[data-action="paste"]').forEach(function(btn) {
    btn.addEventListener('click', pasteClipboard);
  });

  if (controlsToggle) {
    controlsToggle.addEventListener('click', function() {
      setControlsCollapsed(!controlsShell.classList.contains('collapsed'));
    });
    try {
      setControlsCollapsed(localStorage.getItem('codex-mobile-controls-collapsed') === '1');
    } catch (err) {
      setControlsCollapsed(false);
    }
  }

  sendBtn.addEventListener('click', function() { sendText(true); });
  micBtn.addEventListener('click', toggleMic);
  input.addEventListener('input', autoResize);
  input.addEventListener('keydown', function(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendText(true);
    }
  });

  window.addEventListener('resize', syncViewportHeight);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncViewportHeight);
    window.visualViewport.addEventListener('scroll', syncViewportHeight);
  }

  syncViewportHeight();
  input.placeholder = '';
  input.removeAttribute('placeholder');
  autoResize();
  initMic();
  fetchPane(true);
  pollTimer = setInterval(function() { fetchPane(false); }, 1000);
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') fetchPane(true);
  });
</script>
</body>
</html>
