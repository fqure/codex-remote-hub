<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>{{SESSION_NAME}} — Codex Remote Hub Mobile</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: rgba(18, 19, 26, 0.96);
    --surface-2: #11131b;
    --surface-3: #171a24;
    --border: #262936;
    --text: #ece9e2;
    --text-dim: #928f86;
    --accent: #10a37f;
    --accent-2: #13b48d;
    --danger: #ef4444;
    --success: #4ade80;
    --shadow: 0 14px 40px rgba(0, 0, 0, 0.32);
    --radius: 18px;
    --mono: 'SF Mono', 'JetBrains Mono', 'Cascadia Code', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --header-h: 58px;
    --composer-h: 152px;
    --app-height: 100dvh;
    --input-h: 40px;
    --icon-btn-h: 45px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    min-height: 100%;
    width: 100%;
    max-width: 100%;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    overflow-x: hidden;
  }

  body {
    height: var(--app-height);
    overflow: hidden;
  }

  a { color: inherit; }

  .app {
    height: var(--app-height);
    width: 100%;
    max-width: 100%;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(circle at top left, rgba(16, 163, 127, 0.08), transparent 28%),
      radial-gradient(circle at top right, rgba(255, 255, 255, 0.03), transparent 22%),
      var(--bg);
  }

  .header {
    height: calc(var(--header-h) + env(safe-area-inset-top));
    padding: calc(env(safe-area-inset-top) + 8px) 14px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: linear-gradient(180deg, rgba(10, 10, 15, 0.98), rgba(10, 10, 15, 0.92));
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .back-btn,
  .ghost-btn,
  .chip-btn,
  .send-btn,
  .icon-btn {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 12px;
    font: 600 14px/1 var(--sans);
    -webkit-tap-highlight-color: transparent;
  }

  .back-btn,
  .icon-btn {
    width: 40px;
    height: 40px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
  }

  .hot-mic-btn {
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .hot-mic-btn.hot-mic {
    background: rgba(17, 19, 27, 0.96) !important;
    border-color: rgba(239, 68, 68, 0.72) !important;
    color: #ff4d4d !important;
    box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.18), 0 0 18px rgba(239, 68, 68, 0.24);
  }

  .hot-mic-btn .btn-icon {
    fill: none;
    stroke: currentColor;
    stroke-width: 1.65;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .hot-mic-btn.hot-mic .btn-icon,
  .hot-mic-btn.hot-mic .btn-icon path {
    fill: none !important;
    stroke: #ff4d4d !important;
  }

  .session-wrap {
    min-width: 0;
  }

  .session-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    min-width: 0;
  }

  .session-name {
    font: 700 16px/1.1 var(--mono);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .session-updated {
    flex-shrink: 0;
    font: 600 11px/1 var(--sans);
    color: var(--text-dim);
    white-space: nowrap;
  }

  .session-meta {
    margin-top: 4px;
    font: 500 12px/1.2 var(--sans);
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
    text-align: right;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 12px 12px 0;
    gap: 10px;
    overflow: hidden;
  }

  .viewport {
    flex: 1;
    min-height: 0;
    border: 1px solid rgba(255, 255, 255, 0.06);
    background: rgba(10, 11, 16, 0.85);
    border-radius: 22px;
    box-shadow: var(--shadow);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .pane-wrap {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 14px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    overscroll-behavior-x: none;
    touch-action: pan-y;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.12) transparent;
  }

  .pane-wrap::-webkit-scrollbar {
    width: 8px;
  }

  .pane-wrap::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.12);
    border-radius: 999px;
  }

  .pane {
    font: 500 14px/1.5 var(--mono);
    color: #eeece6;
    min-height: min-content;
  }

  .pane-block {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .pane-block + .pane-block {
    margin-top: 1em;
  }

  .pane-block.user {
    color: #10a37f;
  }

  .pane-empty {
    color: var(--text-dim);
  }

  .composer-shell {
    padding: 8px 12px calc(env(safe-area-inset-bottom) + 10px);
    background: linear-gradient(180deg, rgba(10, 10, 15, 0), rgba(10, 10, 15, 0.86) 10%, rgba(10, 10, 15, 0.98) 30%);
    flex-shrink: 0;
    width: 100%;
    max-width: 100%;
    overflow: hidden;
  }

  .composer {
    border: 1px solid rgba(255, 255, 255, 0.06);
    background: var(--surface);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 9px;
    display: grid;
    gap: 8px;
    width: 100%;
    max-width: 100%;
    overflow: hidden;
    margin-top: 5px;
  }

  .tool-row,
  .nav-row,
  .input-row {
    display: flex;
    gap: 8px;
    align-items: center;
    min-width: 0;
    width: 100%;
    max-width: 100%;
  }

  .input-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    min-width: 0;
    gap: 0px;
    width: 100%;
    max-width: 100%;
  }

  .input-stack {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .image-preview-strip {
    display: none;
    gap: 8px;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 2px;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x;
  }

  .image-preview-strip.has-items {
    display: flex;
  }

  .image-preview-card {
    position: relative;
    width: 76px;
    height: 76px;
    flex: 0 0 auto;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: #0e1017;
  }

  .image-preview-thumb {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    background: #0e1017;
  }

  .image-preview-remove {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(10, 10, 15, 0.8);
    color: #fff;
    font: 700 12px/1 var(--sans);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .controls-shell {
    display: grid;
    gap: 4px;
    width: 100%;
    max-width: 100%;
  }

  .controls-toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .controls-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .controls-toggle {
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--text-dim);
    font: 700 11px/1 var(--mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    display: inline-flex;
    align-items: center;
    justify-content: flex-start;
    gap: 4px;
    -webkit-tap-highlight-color: transparent;
    margin-top: 5px;
    margin-bottom: 5px;
    margin-left: 5px;
  }

  .controls-upload-btn {
    width: 36px;
    height: 36px;
    min-width: 36px;
    color: var(--text-dim);
  }

  .controls-toggle .chevron {
    display: inline-block;
    transition: transform 0.18s ease;
    font: 700 11px/1 var(--mono);
  }

  .controls-shell.collapsed .controls-toggle .chevron {
    transform: rotate(90deg);
  }

  .controls-shell.collapsed {
    gap: 0;
  }

  .controls-body {
    display: grid;
    gap: 8px;
    min-width: 0;
    width: 100%;
    max-width: 100%;
  }

  .controls-shell.collapsed .controls-body {
    display: none;
  }

  .tool-row,
  .nav-row {
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }

  .tool-row::-webkit-scrollbar,
  .nav-row::-webkit-scrollbar {
    display: none;
  }

  .chip-btn,
  .ghost-btn {
    height: 36px;
    padding: 0 11px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .ghost-btn {
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-dim);
  }

  .danger-btn {
    color: #ffd6d6;
    border-color: rgba(239, 68, 68, 0.35);
    background: rgba(239, 68, 68, 0.1);
  }

  .enter-btn,
  .send-btn {
    border-color: rgba(16, 163, 127, 0.45);
    background: rgba(16, 163, 127, 0.18);
    color: #dffff5;
  }

  .window-sheet {
    position: fixed;
    inset: 0;
    z-index: 40;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 16px 12px calc(env(safe-area-inset-bottom) + 12px);
    background: rgba(5, 6, 10, 0.72);
    backdrop-filter: blur(8px);
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    touch-action: pan-y;
  }

  .window-sheet.hidden {
    display: none;
  }

  .window-sheet-card {
    width: 100%;
    max-width: 680px;
    height: min(72vh, 640px);
    max-height: min(72vh, 640px);
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 22px;
    background: rgba(18, 19, 26, 0.98);
    box-shadow: var(--shadow);
    padding: 14px;
    min-height: 0;
    overflow: hidden;
  }

  .window-sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .window-sheet-title {
    font: 700 14px/1 var(--mono);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .window-sheet-close {
    width: 34px;
    height: 34px;
    min-width: 34px;
  }

  .window-list {
    display: grid;
    gap: 8px;
    overflow-y: auto;
    overflow-x: hidden;
    min-height: 0;
    flex: 1 1 auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    touch-action: pan-y;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }

  .window-list-empty {
    padding: 18px 10px;
    color: var(--text-dim);
    font: 500 13px/1.4 var(--sans);
    text-align: center;
  }

  .window-item {
    width: 100%;
    text-align: left;
    display: grid;
    gap: 4px;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--surface-2);
    color: var(--text);
  }

  .window-item-owner {
    font: 700 13px/1.2 var(--sans);
  }

  .window-item-title {
    font: 500 12px/1.35 var(--sans);
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .icon-action-btn {
    width: var(--icon-btn-h);
    height: var(--icon-btn-h);
    min-width: var(--icon-btn-h);
    padding: 0 !important;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    background: transparent;
    box-shadow: none;
  }

  .composer-input {
    flex: 1;
    width: 100%;
    min-width: 0;
    min-height: var(--input-h);
    max-height: 84px;
    resize: none;
    border: 1px solid rgba(255, 255, 255, 0.96);
    background: #0e1017;
    border-radius: 10px;
    color: var(--text);
    padding: 10px 11px;
    font: 500 16px/1.35 var(--sans);
    outline: none;
    transition: border-color 0.16s ease, box-shadow 0.16s ease;
  }

  .composer-input:focus {
    border-color: rgba(255, 255, 255, 0.96);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.96);
  }

  .send-btn {
    height: var(--icon-btn-h);
    min-width: var(--icon-btn-h);
    padding: 0;
    font-size: 13px;
  }

  .hot-mic-btn {
    height: var(--icon-btn-h);
    min-width: var(--icon-btn-h);
    padding: 0;
    font-size: 13px;
  }

  .btn-icon {
    width: 78%;
    height: 78%;
    display: block;
    fill: currentColor;
    opacity: 0.95;
    pointer-events: none;
    margin: 0;
  }

  @media (max-width: 699px) {
    .main {
      padding: 8px 8px 0;
      gap: 6px;
    }

    .viewport {
      border-radius: 18px;
    }

    .pane-wrap {
      padding: 10px;
    }

    .composer-shell {
      padding: 0;
    }

    .composer {
      margin: 5px 2px 0;
      padding: 4px;
      gap: 3px;
      border-radius: 16px;
    }

    .input-row {
      grid-template-columns: minmax(0, 1fr) 45px 45px;
      gap: 2px;
    }

    body.input-focus .header,
    body.input-focus .main {
      display: none;
    }

    body.input-focus .composer-shell {
      position: fixed;
      inset: 0;
      z-index: 50;
      padding: calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px);
      background:
        linear-gradient(180deg, rgba(10, 10, 15, 0.98), rgba(10, 10, 15, 0.98)),
        var(--bg);
    }

    body.input-focus .composer {
      margin: 0;
      height: 100%;
      max-height: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 8px;
    }

    body.input-focus .controls-shell {
      display: none;
    }

    body.input-focus .input-row {
      flex: 1;
      min-height: 0;
      align-items: stretch;
    }

    body.input-focus .input-stack {
      flex: 1;
      min-height: 0;
    }

    body.input-focus .composer-input {
      flex: 1;
      min-height: 0;
      height: 100% !important;
      max-height: none;
      font-size: 16px;
      line-height: 1.45;
      padding: 14px 13px;
    }

  }

  body.keyboard-open .header {
    display: none;
  }

  body.keyboard-open .session-meta {
    display: none;
  }

  body.keyboard-open .main {
    padding-top: 4px;
  }

  body.keyboard-open .pane-wrap {
    padding: 8px 10px;
  }

  body.keyboard-open .controls-shell {
    display: none;
  }

  body.keyboard-open .controls-body {
    display: none;
  }

  body.keyboard-open .composer-shell {
    padding: 0;
  }

  .tablet-grid {
    display: contents;
  }

  @media (min-width: 700px) {
    :root {
      --composer-h: 154px;
    }

    .main {
      padding: 18px 18px 0;
      gap: 14px;
    }

    .viewport {
      border-radius: 26px;
    }

    .pane-wrap {
      padding: 20px;
    }

    .pane {
      font-size: 14px;
      line-height: 1.5;
    }

    .composer-shell {
      padding: 12px 18px calc(env(safe-area-inset-bottom) + 14px);
    }

    .composer {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas:
        "tools tools"
        "nav nav"
        "input input";
      align-items: stretch;
      padding: 12px;
    }

    .tool-row,
    .nav-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      overflow: visible;
    }

    .tool-row { grid-area: tools; }
    .nav-row { grid-area: nav; }
    .input-row { grid-area: input; }

    .tool-row .chip-btn,
    .nav-row .chip-btn {
      width: 100%;
      min-width: 0;
      padding: 0 8px;
    }

    .composer-input {
      min-height: 64px;
      max-height: 132px;
      font-size: 17px;
    }

    .send-btn {
      min-width: 90px;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <a class="back-btn" href="/" aria-label="Back to sessions">&#8249;</a>
        <div class="session-wrap">
          <div class="session-top">
            <div class="session-name">{{SESSION_NAME}}</div>
            <div class="session-updated" id="status-text">--:--:--</div>
          </div>
          <div class="session-meta" id="cwd-label">Connecting…</div>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="viewport">
        <div class="pane-wrap" id="pane-wrap">
          <pre class="pane pane-empty" id="pane">Loading terminal output…</pre>
        </div>
      </section>
    </main>

    <div class="composer-shell">
      <section class="composer">
        <div class="controls-shell" id="controls-shell">
          <div class="controls-toggle-row">
            <button type="button" class="controls-toggle" id="controls-toggle" aria-expanded="true" aria-label="Collapse controls">
              <span>Controls</span>
              <span class="chevron">⌃</span>
            </button>
            <div class="controls-header-actions">
              <button id="image-btn" class="ghost-btn icon-action-btn controls-upload-btn" type="button" aria-label="Upload image">
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 5a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h3l1.4-1.5A2 2 0 0 1 9.86 3h4.28a2 2 0 0 1 1.46.5L17 5h3Zm-8 3.25A4.75 4.75 0 1 0 16.75 13 4.76 4.76 0 0 0 12 8.25Zm0 1.5A3.25 3.25 0 1 1 8.75 13 3.25 3.25 0 0 1 12 9.75Z"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="controls-body">
        <div class="tool-row">
          <button class="chip-btn" data-key="Escape">Esc</button>
          <button class="chip-btn" data-key="Tab">Tab</button>
          <button class="chip-btn danger-btn" data-key="C-c">^C</button>
          <button class="chip-btn" data-action="paste">Paste</button>
              <button class="chip-btn enter-btn" data-key="Enter">Enter</button>
              <button class="chip-btn" data-scroll="end">PgEnd</button>
            </div>

            <div class="nav-row">
              <button class="chip-btn" data-shot="screen">Desk</button>
              <button class="chip-btn" data-shot="window">Window</button>
              <button class="chip-btn" data-scroll="up">PgUp</button>
              <button class="chip-btn" data-scroll="down">PgDn</button>
            </div>
          </div>
        </div>

        <div class="input-row">
          <div class="input-stack">
            <div id="image-preview-strip" class="image-preview-strip" aria-live="polite"></div>
            <textarea id="composer-input" class="composer-input" rows="1" aria-label="Send text to Codex"></textarea>
          </div>
          <button id="hot-mic-btn" class="ghost-btn hot-mic-btn icon-action-btn" type="button" aria-label="Start hot mic" title="Hot mic">
            <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 3.75a2.25 2.25 0 0 1 2.25 2.25v6.75a2.25 2.25 0 0 1-4.5 0V6A2.25 2.25 0 0 1 12 3.75Z"></path>
              <path d="M18 10.5v1.5a6 6 0 0 1-12 0v-1.5"></path>
              <path d="M12 18v2.25"></path>
              <path d="M9.75 20.25h4.5"></path>
            </svg>
          </button>
          <button id="send-btn" class="send-btn icon-action-btn" type="button" aria-label="Send">
            <svg class="btn-icon" viewBox="0 0 2.271 2.271" aria-hidden="true">
              <path d="M2.271,1.135c0,0.626 -0.509,1.135 -1.136,1.135c-0.626,-0 -1.135,-0.509 -1.135,-1.135c0,-0.626 0.509,-1.135 1.135,-1.135c0.627,0 1.136,0.509 1.136,1.135Zm-0.731,-0.595l-1.072,0.412c-0.055,0.02 -0.1,0.055 -0.1,0.105c0,0.064 0.047,0.085 0.112,0.103l0.32,0.097c0.047,0.014 0.069,0.016 0.099,-0.012l0.694,-0.647c0.01,-0.009 0.02,-0.006 0.027,-0c0.008,0.007 0.008,0.017 -0,0.026l-0.643,0.698c-0.026,0.029 -0.028,0.05 -0.015,0.1l0.093,0.308c0.021,0.067 0.04,0.119 0.105,0.119c0.049,0 0.085,-0.042 0.11,-0.107l0.408,-1.066c0.011,-0.032 0.018,-0.059 0.018,-0.084c-0,-0.044 -0.027,-0.07 -0.072,-0.07c-0.024,-0 -0.05,0.007 -0.084,0.018Z"/>
            </svg>
          </button>
        </div>
        <input id="image-input" type="file" accept="image/*" multiple hidden>
      </section>
    </div>
  </div>

  <div class="window-sheet hidden" id="window-sheet" aria-hidden="true">
    <div class="window-sheet-card">
      <div class="window-sheet-head">
        <div class="window-sheet-title">Select Window</div>
        <button id="window-sheet-close" class="ghost-btn window-sheet-close" type="button" aria-label="Close window picker">✕</button>
      </div>
      <div class="window-list" id="window-list">
        <div class="window-list-empty">Loading windows…</div>
      </div>
    </div>
  </div>

<script>
  var SESSION = "{{SESSION_NAME}}";
  var paneWrap = document.getElementById('pane-wrap');
  var pane = document.getElementById('pane');
  var cwdLabel = document.getElementById('cwd-label');
  var input = document.getElementById('composer-input');
  var imageBtn = document.getElementById('image-btn');
  var imageInput = document.getElementById('image-input');
  var hotMicBtn = document.getElementById('hot-mic-btn');
  var sendBtn = document.getElementById('send-btn');
  var statusText = document.getElementById('status-text');
  var composerShell = document.querySelector('.composer-shell');
  var controlsShell = document.getElementById('controls-shell');
  var controlsToggle = document.getElementById('controls-toggle');
  var imagePreviewStrip = document.getElementById('image-preview-strip');
  var windowSheet = document.getElementById('window-sheet');
  var windowList = document.getElementById('window-list');
  var windowSheetClose = document.getElementById('window-sheet-close');
  var lastText = "";
  var lastCursorY = null;
  var pollTimer = null;
  var hasLoadedOnce = false;
  var pendingSubmittedText = '';
  var pendingInputSnapshot = '';
  var cachedWindows = [];
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  var recognition = null;
  var recognitionBaseText = '';
  var recognitionListening = false;
  var hotMicEnabled = false;
  var hotMicSendTimer = null;
  var speechTimer = null;
  var speechLastText = '';
  var speechQueue = [];
  var speechPlaybackActive = false;
  var speechPrimed = false;
  var speechVoice = null;
  var recognitionRestartTimer = null;
  var recognitionPausedForSpeech = false;
  var speechPlaybackToken = 0;
  var HOT_MIC_SILENCE_DELAY = 3000;
  var SPEECH_DEBOUNCE_DELAY = 900;

  function isKeyboardOpen() {
    if (!window.visualViewport) return false;
    return (window.innerHeight - window.visualViewport.height) > 120;
  }

  function syncViewportHeight() {
    var keyboardOpen = isKeyboardOpen();
    var height = keyboardOpen && window.visualViewport
      ? window.visualViewport.height
      : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', Math.round(height) + 'px');
    document.body.classList.toggle('keyboard-open', keyboardOpen);
    if (composerShell) {
      document.documentElement.style.setProperty('--composer-h', composerShell.offsetHeight + 'px');
    }
  }

  function autoResize() {
    if (document.body.classList.contains('input-focus') && window.innerWidth < 700) {
      input.style.height = '100%';
      syncViewportHeight();
      return;
    }
    var minHeight = parseFloat(getComputedStyle(input).minHeight) || 0;
    input.style.height = '0px';
    var targetHeight = !input.value.trim()
      ? minHeight
      : Math.min(input.scrollHeight, window.innerWidth >= 700 ? 132 : 84);
    input.style.height = targetHeight + 'px';
    syncViewportHeight();
  }

  function setUpdatedTime(timestamp) {
    if (!statusText) return;
    if (!timestamp) {
      statusText.textContent = '--:--:--';
      return;
    }
    statusText.textContent = new Date(timestamp).toLocaleTimeString([], {
      hour: 'numeric',
      minute: '2-digit',
      second: '2-digit'
    });
  }

  function showStatus(message) {
    if (window.console && message) {
      console.debug(message);
    }
  }

  function stripAnsi(text) {
    return (text || '').replace(/\x1B\[[0-9;?]*[ -/]*[@-~]/g, '');
  }

  function sanitizeForSpeech(text) {
    return stripAnsi(text || '')
      .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, ' ')
      .replace(/\r/g, '')
      .replace(/[ \t]+/g, ' ')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }

  function stripPromptPrefix(line) {
    return (line || '')
      .replace(/^\s*(?:›|\$|❯)\s*/, '')
      .replace(/^\s*[\w.-]+@[\w.-]+(?::[^\s]+)?[$#]\s*/, '')
      .replace(/^\s*(?:~|\/)[^%#$\n]*[%#$]\s*/, '');
  }

  function normalizeSpeechLine(line) {
    return stripPromptPrefix(line)
      .replace(/\s+/g, ' ')
      .trim();
  }

  function normalizeSpeechText(text) {
    return sanitizeForSpeech(text)
      .split('\n')
      .map(normalizeSpeechLine)
      .filter(Boolean)
      .join(' ')
      .trim();
  }

  function splitForSpeech(text) {
    var remaining = (text || '').trim();
    var chunks = [];
    var maxLen = 1800;

    while (remaining.length > maxLen) {
      var cut = remaining.lastIndexOf('\n\n', maxLen);
      if (cut < 300) {
        cut = remaining.lastIndexOf('\n', maxLen);
      }
      if (cut < 300) {
        cut = remaining.lastIndexOf('. ', maxLen);
      }
      if (cut < 300) {
        cut = maxLen;
      }

      var chunk = remaining.slice(0, cut).trim();
      if (chunk) {
        chunks.push(chunk);
      }
      remaining = remaining.slice(cut).trim();
    }

    if (remaining) {
      chunks.push(remaining);
    }

    return chunks;
  }

  function paneTextDelta(previousText, currentText) {
    var prev = previousText || '';
    var next = currentText || '';
    if (!prev) return next;
    if (next.indexOf(prev) === 0) {
      return next.slice(prev.length);
    }

    var prevLines = prev.split('\n');
    var nextLines = next.split('\n');
    var maxOverlap = Math.min(prevLines.length, nextLines.length);
    for (var overlap = maxOverlap; overlap > 0; overlap -= 1) {
      var matches = true;
      for (var j = 0; j < overlap; j += 1) {
        if (prevLines[prevLines.length - overlap + j] !== nextLines[j]) {
          matches = false;
          break;
        }
      }
      if (matches) {
        return nextLines.slice(overlap).join('\n');
      }
    }

    var i = 0;
    while (i < prevLines.length && i < nextLines.length && prevLines[i] === nextLines[i]) {
      i += 1;
    }
    return nextLines.slice(i).join('\n');
  }

  function refreshMicButtonState() {
    if (!hotMicBtn) return;
    hotMicBtn.classList.toggle('hot-mic', hotMicEnabled);
    hotMicBtn.style.background = hotMicEnabled ? 'rgba(17, 19, 27, 0.96)' : '';
    hotMicBtn.style.borderColor = hotMicEnabled ? 'rgba(239, 68, 68, 0.72)' : '';
    hotMicBtn.style.color = hotMicEnabled ? '#ff4d4d' : '';
    hotMicBtn.style.boxShadow = hotMicEnabled
      ? '0 0 0 1px rgba(239, 68, 68, 0.18), 0 0 18px rgba(239, 68, 68, 0.24)'
      : '';
    var micIcon = hotMicBtn.querySelector('.btn-icon');
    if (micIcon) {
      micIcon.style.fill = 'none';
      micIcon.style.stroke = hotMicEnabled ? '#ff4d4d' : '';
    }
    hotMicBtn.setAttribute(
      'aria-label',
      hotMicEnabled ? 'Stop hot mic' : 'Start hot mic'
    );
    hotMicBtn.setAttribute(
      'title',
      hotMicEnabled ? 'Hot mic on' : 'Hot mic off'
    );
  }

  function scheduleRecognitionRestart(delay) {
    clearTimeout(recognitionRestartTimer);
    recognitionRestartTimer = setTimeout(function() {
      if (hotMicEnabled && !recognitionListening && !recognitionPausedForSpeech) {
        startRecognition();
      }
    }, typeof delay === 'number' ? delay : 250);
  }

  function startRecognition() {
    if (!recognition || recognitionListening) return;
    clearTimeout(recognitionRestartTimer);
    recognitionRestartTimer = null;
    try {
      recognition.start();
    } catch (err) {}
  }

  function stopRecognition() {
    if (!recognition || !recognitionListening) return;
    try {
      recognition.stop();
    } catch (err) {}
  }

  function pauseRecognitionForSpeech() {
    if (!hotMicEnabled) return;
    recognitionPausedForSpeech = true;
    clearTimeout(recognitionRestartTimer);
    recognitionRestartTimer = null;
    if (recognitionListening) {
      stopRecognition();
    }
  }

  function resumeRecognitionAfterSpeech() {
    if (!hotMicEnabled) return;
    speechPlaybackActive = false;
    recognitionPausedForSpeech = false;
    scheduleRecognitionRestart(220);
  }

  function stopSpeechPlayback() {
    clearTimeout(speechTimer);
    speechTimer = null;
    speechQueue = [];
    speechPlaybackActive = false;
    speechPlaybackToken += 1;
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  }

  function refreshSpeechVoice() {
    if (!('speechSynthesis' in window)) return;
    var voices = window.speechSynthesis.getVoices();
    if (!voices || !voices.length) {
      speechVoice = null;
      return;
    }

    var language = (navigator.language || 'en-US').toLowerCase();
    speechVoice = voices.find(function(voice) {
      return (voice.lang || '').toLowerCase() === language;
    }) || voices.find(function(voice) {
      return language.indexOf((voice.lang || '').toLowerCase().split('-')[0]) === 0;
    }) || voices.find(function(voice) {
      return voice.default;
    }) || voices[0];
  }

  function primeSpeechSynthesis() {
    if (!('speechSynthesis' in window) || speechPrimed) return;
    try {
      refreshSpeechVoice();
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      var utterance = new SpeechSynthesisUtterance(' ');
      utterance.volume = 0;
      utterance.rate = 1;
      utterance.pitch = 1;
      if (speechVoice) {
        utterance.voice = speechVoice;
      }
      speechPrimed = true;
      window.speechSynthesis.speak(utterance);
      window.setTimeout(function() {
        window.speechSynthesis.cancel();
      }, 0);
    } catch (err) {
      speechPrimed = false;
    }
  }

  function playNextSpeechChunk() {
    if (!hotMicEnabled) {
      stopSpeechPlayback();
      return;
    }

    if (!speechQueue.length) {
      resumeRecognitionAfterSpeech();
      return;
    }

    speechPlaybackActive = true;
    pauseRecognitionForSpeech();
    var activeToken = speechPlaybackToken;
    var utterance = new SpeechSynthesisUtterance(speechQueue.shift());
    utterance.lang = navigator.language || 'en-US';
    utterance.rate = 1;
    utterance.pitch = 1;
    utterance.volume = 1;
    if (speechVoice) {
      utterance.voice = speechVoice;
    }
    utterance.onend = function() {
      if (activeToken !== speechPlaybackToken) {
        return;
      }
      speechPlaybackActive = false;
      playNextSpeechChunk();
    };
    utterance.onerror = function() {
      if (activeToken !== speechPlaybackToken) {
        return;
      }
      speechPlaybackActive = false;
      playNextSpeechChunk();
    };

    window.speechSynthesis.speak(utterance);
  }

  function speakText(text) {
    if (!text || !('speechSynthesis' in window)) return;

    var chunks = splitForSpeech(text);
    if (!chunks.length) return;

    Array.prototype.push.apply(speechQueue, chunks);
    if (!speechPlaybackActive) {
      playNextSpeechChunk();
    }
  }

  function scheduleSpeechFromPane(nextText, submittedText) {
    if (!hotMicEnabled || !('speechSynthesis' in window)) return;
    clearTimeout(speechTimer);
    speechTimer = setTimeout(function() {
      if (!hotMicEnabled) return;

      var delta = paneTextDelta(speechLastText, nextText);
      var normalizedSubmitted = normalizeSpeechText(submittedText);
      var normalizedDelta = normalizeSpeechText(delta);

      while (normalizedSubmitted && normalizedDelta.indexOf(normalizedSubmitted) === 0) {
        normalizedDelta = normalizedDelta.slice(normalizedSubmitted.length).trim();
      }

      if (!normalizedDelta) {
        speechLastText = nextText || '';
        return;
      }

      speechLastText = nextText || '';
      speakText(normalizedDelta);
    }, SPEECH_DEBOUNCE_DELAY);
  }

  function scheduleHotMicSend() {
    if (!hotMicEnabled) return;
    clearTimeout(hotMicSendTimer);
    hotMicSendTimer = setTimeout(function() {
      if (!hotMicEnabled) return;
      if (!input.value.trim()) return;
      sendText(true);
    }, HOT_MIC_SILENCE_DELAY);
  }

  function setHotMicEnabled(enabled) {
    if (enabled && (!SpeechRecognitionCtor || !recognition)) {
      hotMicEnabled = false;
      refreshMicButtonState();
      showStatus('Speech recognition unavailable here');
      return;
    }

    hotMicEnabled = enabled;
    clearTimeout(hotMicSendTimer);
    hotMicSendTimer = null;
    clearTimeout(recognitionRestartTimer);
    recognitionRestartTimer = null;

    if (enabled) {
      speechLastText = lastText || '';
      recognitionPausedForSpeech = false;
      primeSpeechSynthesis();
      if (document.activeElement === input) {
        input.blur();
        document.body.classList.remove('input-focus');
        syncViewportHeight();
      }
      showStatus('Hot mic on');
      startRecognition();
    } else {
      stopSpeechPlayback();
      recognitionPausedForSpeech = false;
      stopRecognition();
      showStatus('Hot mic off');
    }

    refreshMicButtonState();
  }

  function handleMicButtonTap() {
    setHotMicEnabled(!hotMicEnabled);
  }

  function activateMic(event) {
    if (event && event.cancelable) {
      event.preventDefault();
    }
    handleMicButtonTap();
  }

  function setControlsCollapsed(collapsed) {
    if (!controlsShell || !controlsToggle) return;
    controlsShell.classList.toggle('collapsed', collapsed);
    controlsToggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    controlsToggle.setAttribute('aria-label', collapsed ? 'Expand controls' : 'Collapse controls');
    try {
      localStorage.setItem('codex-mobile-controls-collapsed', collapsed ? '1' : '0');
    } catch (err) {}
    syncViewportHeight();
  }

  function formatPathTail(path) {
    if (!path) return 'No working directory';
    var parts = path.split('/').filter(Boolean);
    if (!parts.length) return path;
    var tail = parts.slice(-2).join('/');
    return parts.length > 2 ? '…/' + tail : tail;
  }

  function linkifyText(text) {
    var fragment = document.createDocumentFragment();
    var pattern = /(https?:\/\/[^\s<>"']+)/g;
    var lastIndex = 0;
    var match;

    while ((match = pattern.exec(text)) !== null) {
      if (match.index > lastIndex) {
        fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
      }
      var href = match[1];
      var link = document.createElement('a');
      link.href = href;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = href;
      link.style.color = 'inherit';
      link.style.textDecoration = 'underline';
      fragment.appendChild(link);
      lastIndex = match.index + href.length;
    }

    if (lastIndex < text.length) {
      fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
    }

    return fragment;
  }

  function renderPaneText(text) {
    pane.innerHTML = '';

    if (!text) {
      pane.textContent = 'Waiting for terminal output…';
      pane.classList.add('pane-empty');
      return;
    }

    pane.classList.remove('pane-empty');

    var blocks = text.split(/\n{2,}/);
    blocks.forEach(function(block) {
      var el = document.createElement('div');
      el.className = 'pane-block';
      if (block.trim().startsWith('›')) {
        el.classList.add('user');
      }
      el.appendChild(linkifyText(block));
      pane.appendChild(el);
    });
  }

  function normalizeMatchText(text) {
    return (text || '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function insertAssetUrls(assets) {
    if (!assets || !assets.length) return;
    var refs = assets
      .map(function(asset) { return window.location.origin + asset.url; })
      .join('\n');
    input.value = input.value.trim()
      ? input.value.replace(/\s+$/, '') + '\n' + refs
      : refs;
    renderImagePreviews();
    autoResize();
    input.focus();
  }

  function insertComposerText(text) {
    if (!text) return;
    input.value = input.value.trim()
      ? input.value.replace(/\s+$/, '') + '\n' + text
      : text;
    renderImagePreviews();
    autoResize();
    input.focus();
  }

  function extractImageUrls(text) {
    var matches = (text || '').match(/https?:\/\/[^\s<>"']+\.(?:png|jpe?g|gif|webp|bmp)(?:\?[^\s<>"']*)?/gi) || [];
    var seen = Object.create(null);
    return matches.filter(function(url) {
      if (seen[url]) return false;
      seen[url] = true;
      return true;
    });
  }

  function removeImageUrl(url) {
    if (!url) return;
    var escaped = url.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var linePattern = new RegExp('(?:^|\\n)' + escaped + '(?=\\n|$)', 'g');
    input.value = input.value
      .replace(linePattern, '')
      .replace(/\n{3,}/g, '\n\n')
      .replace(/^\n+|\n+$/g, '');
    renderImagePreviews();
    autoResize();
    input.focus();
  }

  function renderImagePreviews() {
    if (!imagePreviewStrip) return;
    var urls = extractImageUrls(input.value);
    imagePreviewStrip.innerHTML = '';
    imagePreviewStrip.classList.toggle('has-items', urls.length > 0);
    urls.forEach(function(url) {
      var card = document.createElement('div');
      card.className = 'image-preview-card';

      var img = document.createElement('img');
      img.className = 'image-preview-thumb';
      img.src = url;
      img.alt = 'Image preview';
      img.loading = 'lazy';

      var remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'image-preview-remove';
      remove.setAttribute('aria-label', 'Remove image URL');
      remove.textContent = '×';
      remove.addEventListener('click', function() {
        removeImageUrl(url);
      });

      card.appendChild(img);
      card.appendChild(remove);
      imagePreviewStrip.appendChild(card);
    });
  }

  async function uploadImages(files) {
    if (!files || !files.length) return;
    var form = new FormData();
    Array.prototype.forEach.call(files, function(file) {
      form.append('image', file, file.name);
    });

    try {
      var res = await fetch('/api/upload-image/' + encodeURIComponent(SESSION), {
        method: 'POST',
        body: form
      });
      var data = await res.json();
      if (!res.ok || !data.ok || !data.saved || !data.saved.length) {
        showStatus('Image upload failed');
        return;
      }
      insertAssetUrls(data.saved);
      showStatus(data.saved.length === 1 ? 'Image URL inserted' : 'Image URLs inserted');
    } catch (err) {
      showStatus('Image upload failed');
    } finally {
      imageInput.value = '';
    }
  }

  async function requestScreenshot(mode) {
    var labels = {
      screen: 'desktop screenshot'
    };

    showStatus('Preparing ' + (labels[mode] || 'screenshot'));
    try {
      var res = await fetch('/api/screenshot/' + encodeURIComponent(SESSION), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: mode })
      });
      var data = await res.json();
      if (!res.ok || !data.ok || !data.screenshot || !data.screenshot.public_url) {
        showStatus((data && data.error) || 'Screenshot failed');
        return;
      }
      insertComposerText(data.screenshot.public_url);
      showStatus('Screenshot URL inserted');
    } catch (err) {
      showStatus('Screenshot failed');
    }
  }

  function renderWindowChoices(windows) {
    if (!windowList) return;
    windowList.innerHTML = '';
    if (!windows || !windows.length) {
      var empty = document.createElement('div');
      empty.className = 'window-list-empty';
      empty.textContent = 'No selectable windows found.';
      windowList.appendChild(empty);
      return;
    }

    windows.forEach(function(item) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'window-item';
      btn.dataset.windowId = String(item.id);

      var owner = document.createElement('div');
      owner.className = 'window-item-owner';
      owner.textContent = item.owner;

      var title = document.createElement('div');
      title.className = 'window-item-title';
      title.textContent = item.title;

      btn.appendChild(owner);
      btn.appendChild(title);
      btn.addEventListener('click', function() {
        requestWindowScreenshot(Number(item.id));
      });
      windowList.appendChild(btn);
    });
  }

  function setWindowSheetOpen(open) {
    if (!windowSheet) return;
    windowSheet.classList.toggle('hidden', !open);
    windowSheet.setAttribute('aria-hidden', open ? 'false' : 'true');
    document.body.classList.toggle('window-sheet-open', open);
  }

  async function openWindowPicker() {
    setWindowSheetOpen(true);
    renderWindowChoices(cachedWindows);
    try {
      var res = await fetch('/api/windows', { cache: 'no-store' });
      var data = await res.json();
      cachedWindows = (data && data.windows) || [];
      renderWindowChoices(cachedWindows);
    } catch (err) {
      renderWindowChoices([]);
      showStatus('Window list unavailable');
    }
  }

  async function requestWindowScreenshot(windowId) {
    if (!windowId) return;
    showStatus('Preparing window screenshot');
    try {
      var res = await fetch('/api/screenshot/' + encodeURIComponent(SESSION), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mode: 'window', window_id: windowId })
      });
      var data = await res.json();
      if (!res.ok || !data.ok || !data.screenshot || !data.screenshot.public_url) {
        showStatus((data && data.error) || 'Window screenshot failed');
        return;
      }
      setWindowSheetOpen(false);
      insertComposerText(data.screenshot.public_url);
      showStatus('Window screenshot URL inserted');
    } catch (err) {
      showStatus('Window screenshot failed');
    }
  }

  function maybeClearPendingInput(nextText) {
    if (!pendingSubmittedText) return;

    var sent = normalizeMatchText(pendingSubmittedText);
    var paneText = normalizeMatchText(nextText);
    if (!sent || !paneText.includes(sent)) return;
    var snapshot = pendingInputSnapshot;

    pendingSubmittedText = '';
    pendingInputSnapshot = '';

    if (input.value === snapshot) {
      input.value = '';
      renderImagePreviews();
      autoResize();
      if (!hotMicEnabled) {
        input.focus();
      }
      return;
    }

    renderImagePreviews();
    autoResize();
  }

  async function fetchPane(forceStick) {
    try {
      var res = await fetch('/api/pane/' + encodeURIComponent(SESSION) + '?lines=120', {
        cache: 'no-store'
      });
      var data = await res.json();
      if (!data.ok) {
        pane.textContent = 'Session not found. Go back and reopen it.';
        pane.classList.add('pane-empty');
        setUpdatedTime(null);
        return;
      }

      var nextText = data.text || '';
      var nextCursorY = typeof data.cursor_y === 'number' ? data.cursor_y : null;
      if (nextText !== lastText || nextCursorY !== lastCursorY) {
        var submittedForSpeech = pendingSubmittedText;
        renderPaneText(nextText);
        if (nextText !== lastText) {
          scheduleSpeechFromPane(nextText, submittedForSpeech);
        }
        maybeClearPendingInput(nextText);
        lastText = nextText;
        lastCursorY = nextCursorY;
      }
      cwdLabel.textContent = formatPathTail(data.cwd || '');
      setUpdatedTime(data.updated);
      if (!hasLoadedOnce) {
        paneWrap.scrollTop = 0;
      }
      hasLoadedOnce = true;
    } catch (err) {
      showStatus('Connection issue');
    }
  }

  async function postJson(path, payload) {
    var res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    return res.ok;
  }

  async function runSteps(steps, label) {
    var ok = true;
    for (var i = 0; i < steps.length; i += 1) {
      var step = steps[i];
      if (step.key) {
        ok = await postJson('/api/send-keys/' + encodeURIComponent(SESSION), { key: step.key });
      } else if (typeof step.text === 'string') {
        ok = await postJson('/api/send-text/' + encodeURIComponent(SESSION), { text: step.text });
      }

      if (!ok) break;

      if (i < steps.length - 1) {
        await new Promise(function(resolve) { setTimeout(resolve, 60); });
      }
    }

    showStatus(ok ? 'Sent ' + label : 'Action failed');
    setTimeout(function() { fetchPane(true); }, 140);
    return ok;
  }

  async function sendKey(key) {
    await runSteps([{ key: key }], key);
  }

  function scrollPane(direction) {
    if (!paneWrap) return;
    if (direction === 'end') {
      paneWrap.scrollTo({
        top: paneWrap.scrollHeight,
        behavior: 'smooth'
      });
      return;
    }
    var amount = Math.max(120, Math.floor(paneWrap.clientHeight * 0.82));
    var delta = direction === 'up' ? -amount : amount;
    paneWrap.scrollBy({
      top: delta,
      behavior: 'smooth'
    });
  }

  async function sendText(withEnter) {
    var text = input.value;
    if (!text.trim()) {
      if (withEnter) return sendKey('Enter');
      return;
    }

    clearTimeout(hotMicSendTimer);
    hotMicSendTimer = null;

    var composedText = text;
    var ok = await postJson('/api/send-text/' + encodeURIComponent(SESSION), { text: composedText });
    if (ok && withEnter) {
      ok = await postJson('/api/send-keys/' + encodeURIComponent(SESSION), { key: 'Enter' });
    }

    showStatus(ok ? 'Sent to Codex' : 'Send failed');
    if (ok) {
      primeSpeechSynthesis();
      pendingSubmittedText = composedText;
      pendingInputSnapshot = input.value;
      if (hotMicEnabled) {
        input.value = '';
        renderImagePreviews();
        autoResize();
      }
      setTimeout(function() { fetchPane(true); }, 120);
    }
  }

  async function pasteClipboard() {
    try {
      var text = await navigator.clipboard.readText();
      if (!text) return;
      input.value += text;
      renderImagePreviews();
      autoResize();
      input.focus();
    } catch (err) {
      showStatus('Clipboard unavailable');
    }
  }

  function setMicState(listening) {
    recognitionListening = listening;
    refreshMicButtonState();
  }

  function mergeTranscriptWithBaseText(baseText, transcript) {
    var base = baseText || '';
    var next = transcript || '';
    if (!base) return next;
    if (!next) return base;
    return /\s$/.test(base) ? base + next : base + ' ' + next;
  }

  function initMic() {
    if (!SpeechRecognitionCtor) return;

    recognition = new SpeechRecognitionCtor();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = navigator.language || 'en-US';

    recognition.onstart = function() {
      recognitionBaseText = input.value;
      setMicState(true);
      showStatus(hotMicEnabled ? 'Hot mic listening' : 'Listening…');
    };

    recognition.onresult = function(event) {
      var transcript = '';
      for (var i = event.resultIndex; i < event.results.length; i += 1) {
        transcript += event.results[i][0].transcript;
      }
      transcript = transcript.trim();
      input.value = mergeTranscriptWithBaseText(recognitionBaseText, transcript);
      autoResize();
      if (hotMicEnabled) {
        scheduleHotMicSend();
      }
    };

    recognition.onerror = function(event) {
      setMicState(false);
      var errorCode = event && event.error ? event.error : '';
      if (hotMicEnabled) {
        if (errorCode === 'not-allowed' || errorCode === 'service-not-allowed') {
          setHotMicEnabled(false);
          showStatus('Hot mic unavailable');
          return;
        }
        if (!recognitionPausedForSpeech) {
          scheduleRecognitionRestart(350);
        }
        showStatus(errorCode === 'no-speech' ? 'Hot mic waiting' : 'Hot mic listening');
        return;
      }
      showStatus('Mic unavailable here');
      input.focus();
    };

    recognition.onend = function() {
      setMicState(false);
      if (recognitionPausedForSpeech) {
        resumeRecognitionAfterSpeech();
        return;
      }
      if (hotMicEnabled) {
        showStatus('Hot mic listening');
        scheduleRecognitionRestart(250);
        return;
      }
      input.focus();
      showStatus(input.value.trim()
        ? 'Transcript ready to send'
        : 'Mic stopped');
    };
  }

  document.querySelectorAll('[data-key]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      sendKey(btn.getAttribute('data-key'));
    });
  });

  document.querySelectorAll('[data-scroll]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      scrollPane(btn.getAttribute('data-scroll'));
    });
  });

  document.querySelectorAll('[data-shot]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var mode = btn.getAttribute('data-shot');
      if (mode === 'window') {
        openWindowPicker();
        return;
      }
      requestScreenshot(mode);
    });
  });

  document.querySelectorAll('[data-action="paste"]').forEach(function(btn) {
    btn.addEventListener('click', pasteClipboard);
  });

  if (imageBtn && imageInput) {
    imageBtn.addEventListener('click', function() {
      imageInput.click();
    });
    imageInput.addEventListener('change', function() {
      uploadImages(imageInput.files);
    });
  }

  if (controlsToggle) {
    controlsToggle.addEventListener('click', function() {
      setControlsCollapsed(!controlsShell.classList.contains('collapsed'));
    });
    try {
      setControlsCollapsed(localStorage.getItem('codex-mobile-controls-collapsed') === '1');
    } catch (err) {
      setControlsCollapsed(false);
    }
  }

  if (windowSheetClose) {
    windowSheetClose.addEventListener('click', function() {
      setWindowSheetOpen(false);
    });
  }

  if (windowSheet) {
    windowSheet.addEventListener('click', function(event) {
      if (event.target === windowSheet) {
        setWindowSheetOpen(false);
      }
    });
  }

  sendBtn.addEventListener('click', function() { sendText(true); });
  if (hotMicBtn) {
    hotMicBtn.addEventListener('touchend', activateMic, { passive: false });
    hotMicBtn.addEventListener('click', function(event) {
      if (event.detail !== 0) {
        event.preventDefault();
        return;
      }
      activateMic(event);
    });
  }
  input.addEventListener('focus', function() {
    if (window.innerWidth < 700) {
      document.body.classList.add('input-focus');
      syncViewportHeight();
      autoResize();
    }
  });
  input.addEventListener('blur', function() {
    window.setTimeout(function() {
      if (document.activeElement !== input && !isKeyboardOpen()) {
        document.body.classList.remove('input-focus');
        syncViewportHeight();
        autoResize();
      }
    }, 120);
  });
  input.addEventListener('input', function() {
    renderImagePreviews();
    autoResize();
  });
  input.addEventListener('keydown', function(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendText(true);
    }
  });

  window.addEventListener('resize', syncViewportHeight);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncViewportHeight);
    window.visualViewport.addEventListener('scroll', syncViewportHeight);
  }

  syncViewportHeight();
  input.placeholder = '';
  input.removeAttribute('placeholder');
  renderImagePreviews();
  autoResize();
  if ('speechSynthesis' in window && typeof window.speechSynthesis.onvoiceschanged !== 'undefined') {
    window.speechSynthesis.onvoiceschanged = refreshSpeechVoice;
  }
  refreshSpeechVoice();
  initMic();
  refreshMicButtonState();
  fetchPane(true);
  pollTimer = setInterval(function() { fetchPane(false); }, 1000);
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
      fetchPane(true);
      if (hotMicEnabled && !recognitionListening && !recognitionPausedForSpeech) {
        scheduleRecognitionRestart(50);
      }
    }
  });
</script>
</body>
</html>
