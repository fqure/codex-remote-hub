<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F3EE">
<title>{{SESSION_NAME}} — {{SESSION_PRODUCT}} Remote Hub Mobile</title>
<style>
  /* ── Design tokens ── */
  :root {
    --bg: #F5F1EB;
    --surface: #FFFFFF;
    --surface-warm: #FDFBF8;
    --surface-dim: #EDE8E1;
    --border: #DDD6CB;
    --border-light: #EAE4DC;
    --text: #2D2926;
    --text-secondary: #78716C;
    --text-tertiary: #A8A29E;
    --accent: #C2613A;
    --accent-soft: #FDF0EB;
    --accent-hover: #A04E2E;
    --danger: #DC2626;
    --danger-soft: #FEF2F2;
    --shadow-sm: 0 1px 3px rgba(45,41,38,0.06);
    --shadow-md: 0 4px 16px rgba(45,41,38,0.08);
    --shadow-lg: 0 8px 32px rgba(45,41,38,0.10);
    --shadow-glow: 0 0 0 3px rgba(194,97,58,0.15);
  }

  /* ── Codex agent overrides ── */
  body.agent-codex {
    --accent: #4A90B8;
    --accent-soft: #EDF5FA;
    --accent-hover: #3A7499;
    --shadow-glow: 0 0 0 3px rgba(74,144,184,0.15);
    --surface-warm: #F8FBFD;
    --sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    --mono: 'SF Mono', ui-monospace, Menlo, monospace;
    --header-h: 44px;
    --app-height: 100dvh;
    --input-h: 44px;
    --toolbar-icon-size: 30px;
    --radius-full: 999px;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    height: 100%; width: 100%; max-width: 100%;
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
    overflow: hidden;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
  }
  body { height: var(--app-height); }
  a { color: inherit; }

  /* ── Variant switcher (temporary for review) ── */
  .variant-switcher {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; justify-content: center; gap: 0;
    background: var(--text); padding: 2px;
    padding-top: calc(env(safe-area-inset-top) + 2px);
  }
  .variant-switcher button {
    flex: 1; border: 0; padding: 7px 0;
    font: 600 12px/1 var(--sans); color: var(--text-tertiary);
    background: transparent; cursor: pointer;
    transition: all 0.2s;
  }
  .variant-switcher button.active {
    color: #fff; background: var(--accent); border-radius: 6px;
  }
  body.has-switcher .header {
    margin-top: 28px;
  }

  /* ── App shell ── */
  .app {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    height: var(--app-height);
    width: 100%; max-width: 100%;
    display: flex; flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }

  /* ── Header — slim status bar ── */
  .header {
    min-height: calc(var(--header-h) + env(safe-area-inset-top));
    padding: calc(env(safe-area-inset-top) + 10px) 12px 10px;
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid rgba(45,41,38,0.08);
    flex-shrink: 0;
    z-index: 10;
  }

  .back-btn {
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 0; background: transparent;
    color: var(--accent); font-size: 22px; font-weight: 300;
    text-decoration: none; border-radius: var(--radius-full);
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
  }

  .session-wrap {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .session-top {
    width: 100%;
    min-width: 0;
  }

  .session-name {
    font: 600 20px/1.2 var(--sans);
    color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: -0.02em;
  }

  .session-updated {
    margin-top: 3px;
    width: 100%;
    font: 600 12px/1.25 var(--sans);
    color: var(--accent);
    text-align: left;
    white-space: normal;
    word-break: break-word;
  }

  .session-meta {
    margin-top: 3px;
    font: 400 11px/1.2 var(--sans);
    color: var(--text-tertiary);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    text-align: left;
    width: 100%;
  }

  .header-actions {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }

  /* ── Main viewport ── */
  .main {
    flex: 1; min-height: 0;
    display: flex; flex-direction: column;
    padding: 8px 10px 0;
    overflow: hidden;
    transition: flex 0.35s ease;
  }

  .viewport {
    flex: 1; min-height: 0;
    border: 0.5px solid var(--border-light);
    background: var(--surface-warm);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,0.9);
    overflow: hidden;
    display: flex; flex-direction: column;
  }

  .pane-wrap {
    flex: 1; min-height: 0;
    overflow-y: auto; overflow-x: hidden;
    padding: 14px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain;
    overscroll-behavior-x: none;
    touch-action: pan-y;
    scrollbar-width: thin;
    scrollbar-color: rgba(45,41,38,0.12) transparent;
  }
  .pane-wrap::-webkit-scrollbar { width: 5px; }
  .pane-wrap::-webkit-scrollbar-thumb {
    background: rgba(45,41,38,0.12); border-radius: var(--radius-full);
  }

  .pane {
    font: 400 13.5px/1.65 var(--mono);
    color: var(--text);
    min-height: min-content;
  }

  .pane-block {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .pane-block + .pane-block { margin-top: 0.8em; }

  .pane-block.user {
    color: var(--accent);
    border-left: 2.5px solid var(--accent);
    padding-left: 10px;
    margin-left: -2px;
    background: linear-gradient(90deg, var(--accent-soft), transparent 60%);
    border-radius: 0 4px 4px 0;
  }

  .pane-empty { color: var(--text-tertiary); }

  /* ── Composer shell ── */
  .composer-shell {
    padding: 4px 10px calc(env(safe-area-inset-bottom) + 4px);
    flex-shrink: 0;
    width: 100%; max-width: 100%; overflow: hidden;
    transition: flex 0.35s ease;
  }

  .composer {
    background: var(--surface);
    border: 0.5px solid var(--border-light);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    padding: 6px 8px;
    display: grid; gap: 5px;
    width: 100%; max-width: 100%; overflow: hidden;
  }

  /* ── Toolbar strip — icon-only buttons ── */
  .toolbar-strip {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 0;
  }

  .toolbar-icon {
    width: var(--toolbar-icon-size);
    height: var(--toolbar-icon-size);
    min-width: var(--toolbar-icon-size);
    border: 0; border-radius: var(--radius-full);
    background: var(--surface-dim);
    color: var(--text-secondary);
    display: inline-flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, color 0.15s;
    padding: 0;
  }
  .toolbar-icon:active {
    background: var(--border);
    color: var(--text);
  }
  .toolbar-icon svg {
    width: 15px; height: 15px;
    fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }

  .toolbar-sep {
    width: 1px; height: 18px;
    background: var(--border-light);
    flex-shrink: 0; margin: 0 2px;
  }

  /* ── Input pill ── */
  .input-row {
    display: flex; gap: 6px; align-items: flex-end;
    min-width: 0; width: 100%; max-width: 100%;
  }
  .input-stack {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 6px;
  }

  .input-pill-wrap {
    display: flex; align-items: flex-end; gap: 4px;
    background: var(--surface-dim);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 3px 3px 3px 12px;
    transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    position: relative;
  }
  .input-pill-wrap:focus-within {
    border-color: var(--accent);
    box-shadow: var(--shadow-glow);
    background: var(--surface);
  }

  .composer-input {
    flex: 1; width: 100%; min-width: 0;
    min-height: 32px; max-height: 84px;
    resize: none; border: 0; background: transparent;
    color: var(--text);
    padding: 7px 8px 7px 0;
    font: 400 16px/1.4 var(--sans);
    outline: none;
    caret-color: var(--accent);
    -webkit-appearance: none;
    overflow: hidden;
  }
  .composer-input::placeholder { color: var(--text-tertiary); }

  /* ── Send button ── */
  .send-btn {
    width: 36px; height: 36px; min-width: 36px;
    border: 0; border-radius: var(--radius-full);
    background: var(--accent);
    color: #fff;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px color-mix(in srgb, var(--accent) 30%, transparent);
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
    padding: 0;
  }
  .send-btn:active { background: var(--accent-hover); transform: scale(0.92); }
  .send-btn .btn-icon {
    width: 20px; height: 20px;
    fill: none; stroke: currentColor;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
  }

  /* ── Hot mic button — base ── */
  .hot-mic-btn {
    border: 0; border-radius: var(--radius-full);
    background: var(--surface-dim);
    color: var(--text-secondary);
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    transition: all 0.25s ease;
    padding: 0;
    cursor: pointer;
  }
  .hot-mic-btn .btn-icon {
    fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    pointer-events: none;
  }

  .mic-label {
    font: 600 14px/1 var(--sans);
    letter-spacing: 0.02em;
    pointer-events: none;
  }

  /* Hot mic ACTIVE state (all variants) */
  .hot-mic-btn.hot-mic {
    background: var(--danger) !important;
    color: #fff !important;
    border-color: var(--danger) !important;
    box-shadow: 0 0 0 4px rgba(220,38,38,0.15), 0 4px 16px rgba(220,38,38,0.25) !important;
    animation: mic-pulse 3s ease-in-out infinite;
  }
  .hot-mic-btn.hot-mic .btn-icon,
  .hot-mic-btn.hot-mic .btn-icon path {
    fill: none !important; stroke: #fff !important;
  }

  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 3px rgba(220,38,38,0.1), 0 0 10px rgba(220,38,38,0.15); }
    50% { box-shadow: 0 0 0 8px rgba(220,38,38,0.06), 0 0 28px rgba(220,38,38,0.3); }
  }

  /* ── VARIANT A: Large hero mic button ── */
  body.variant-a .hot-mic-btn {
    width: 100%; height: 38px;
    border: 1.5px solid var(--border);
    font-size: 13px;
  }
  body.variant-a .hot-mic-btn .btn-icon { width: 20px; height: 20px; }
  body.variant-a .mic-label { display: inline; }
  body.variant-a .hot-mic-btn.hot-mic { border-color: var(--danger) !important; }

  /* ── VARIANT B: Integrated inside input pill ── */
  body.variant-b .mic-row { display: none; }
  body.variant-b .hot-mic-btn {
    width: 36px; height: 36px; min-width: 36px;
    flex-shrink: 0;
    border: 0;
  }
  body.variant-b .hot-mic-btn .btn-icon { width: 20px; height: 20px; }
  body.variant-b .mic-label { display: none; }
  body.variant-b .input-pill-wrap { padding-right: 4px; }
  body.variant-b .input-pill-mic { display: flex; }

  /* ── VARIANT C: Inline left of input ── */
  body.variant-c .hot-mic-btn {
    width: 44px; height: 44px; min-width: 44px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    box-shadow: var(--shadow-sm);
    flex-shrink: 0;
  }
  body.variant-c .hot-mic-btn .btn-icon { width: 22px; height: 22px; }
  body.variant-c .mic-label { display: none; }
  body.variant-c .hot-mic-btn:active {
    transform: scale(0.92);
  }

  /* Default: variant A visible, B hidden */
  .input-pill-mic { display: none; }
  .mic-row { display: flex; }

  /* ── Swipe-up tray ── */
  .controls-shell {
    display: grid; gap: 0;
    width: 100%; max-width: 100%;
  }

  .controls-toggle-row {
    display: flex; align-items: center; justify-content: center;
  }

  .controls-header-actions { display: none; }

  .controls-toggle {
    padding: 2px 0; border: 0;
    background: transparent;
    color: var(--text-tertiary);
    font: 500 14px/1 var(--sans);
    display: inline-flex; align-items: center; justify-content: center;
    -webkit-tap-highlight-color: transparent;
    width: 44px;
  }
  .controls-toggle .chevron {
    display: inline-block;
    transition: transform 0.25s ease;
    letter-spacing: 2px;
  }

  .controls-body {
    display: grid; gap: 6px;
    overflow: hidden;
    max-height: 60px;
    transition: max-height 0.3s ease, opacity 0.2s ease, padding 0.3s ease;
    opacity: 1;
    padding-top: 6px;
  }

  .controls-shell.collapsed .controls-body {
    max-height: 0;
    opacity: 0;
    padding-top: 0;
  }

  .tray-grid {
    display: flex; gap: 5px;
    justify-content: center; flex-wrap: nowrap;
    overflow-x: auto; scrollbar-width: none;
  }
  .tray-grid::-webkit-scrollbar { display: none; }

  .tray-btn,
  .chip-btn,
  .ghost-btn {
    height: 26px; padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: var(--radius-full);
    background: var(--surface-dim);
    color: var(--text-secondary);
    font: 500 11px/1 var(--sans);
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s;
  }
  .tray-btn:active, .chip-btn:active {
    background: var(--border);
  }

  .tray-btn.danger-btn {
    color: var(--danger);
    border-color: rgba(220,38,38,0.25);
    background: var(--danger-soft);
  }

  .enter-btn { display: none; }

  /* ── Image previews ── */
  .image-preview-strip {
    display: none; gap: 8px;
    flex-direction: column;
    overflow-y: auto; overflow-x: hidden;
    max-height: 180px;
    padding-bottom: 2px;
    -webkit-overflow-scrolling: touch; touch-action: pan-y;
  }
  .image-preview-strip.has-items { display: flex; }

  .image-preview-card {
    position: relative; width: 100%; height: 140px;
    flex: 0 0 140px; border-radius: var(--radius-md);
    overflow: hidden; border: 1px solid var(--border);
    background: var(--surface-dim);
    align-self: stretch;
  }
  .image-preview-thumb {
    display: block; width: 100%; height: 100%;
    object-fit: cover; background: var(--surface-dim);
  }
  .image-preview-remove {
    position: absolute; top: 4px; right: 4px;
    width: 20px; height: 20px; border-radius: 50%;
    border: 0; background: rgba(45,41,38,0.7);
    color: #fff; font: 700 11px/1 var(--sans);
    display: inline-flex; align-items: center; justify-content: center;
  }

  /* ── Window picker sheet ── */
  .window-sheet {
    position: fixed; inset: 0; z-index: 40;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 16px 12px calc(env(safe-area-inset-bottom) + 12px);
    background: rgba(45,41,38,0.25);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain; touch-action: pan-y;
  }
  .window-sheet.hidden { display: none; }

  .window-sheet-card {
    width: 100%; max-width: 680px;
    height: min(72vh, 640px); max-height: min(72vh, 640px);
    display: flex; flex-direction: column; gap: 10px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    background: var(--surface);
    box-shadow: var(--shadow-lg);
    padding: 14px; min-height: 0; overflow: hidden;
  }

  .window-sheet-head {
    display: flex; align-items: center;
    justify-content: space-between; gap: 12px;
  }
  .window-sheet-title {
    font: 600 14px/1 var(--sans);
    letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--text-secondary);
  }
  .window-sheet-close {
    width: 32px; height: 32px; min-width: 32px;
    border: 0; border-radius: var(--radius-full);
    background: var(--surface-dim); color: var(--text-secondary);
    font: 500 16px/1 var(--sans);
    display: inline-flex; align-items: center; justify-content: center;
  }

  .window-list {
    display: grid; gap: 6px;
    overflow-y: auto; overflow-x: hidden; min-height: 0; flex: 1 1 auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-y: contain; touch-action: pan-y;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }
  .window-list-empty {
    padding: 24px 10px; color: var(--text-tertiary);
    font: 400 14px/1.5 var(--sans); text-align: center;
  }
  .window-item {
    width: 100%; text-align: left;
    display: grid; gap: 3px; padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface-dim); color: var(--text);
  }
  .window-item-owner { font: 600 13px/1.2 var(--sans); }
  .window-item-title {
    font: 400 12px/1.35 var(--sans); color: var(--text-secondary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .voice-command-editor {
    width: 100%;
    min-height: 220px;
    flex: 1 1 auto;
    resize: none;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface-dim);
    color: var(--text);
    padding: 12px;
    font: 400 14px/1.5 var(--mono);
    outline: none;
    box-shadow: inset 0 1px 2px rgba(45,41,38,0.04);
  }
  .voice-command-editor::placeholder {
    color: var(--text-tertiary);
  }

  /* ── Icon sizing helper ── */
  .icon-action-btn {
    padding: 0 !important;
  }
  .btn-icon {
    display: block; pointer-events: none; margin: 0;
  }

  /* ── 50/50 split: input-focus / hot-mic-compose ── */
  body.input-focus .main,
  body.hot-mic-compose .main {
    flex: 0 0 45%;
    min-height: 0;
    padding-bottom: 4px;
  }

  body.input-focus .composer-shell,
  body.hot-mic-compose .composer-shell {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    padding-bottom: 0;
  }

  body.input-focus .composer,
  body.hot-mic-compose .composer {
    height: 100%;
    display: flex; flex-direction: column;
    gap: 6px;
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
    margin-bottom: 0;
  }

  body.input-focus .input-row,
  body.hot-mic-compose .input-row {
    flex: 1; min-height: 0; align-items: stretch;
  }

  body.input-focus .input-stack,
  body.hot-mic-compose .input-stack {
    flex: 1; min-height: 0;
  }

  body.input-focus .input-pill-wrap,
  body.hot-mic-compose .input-pill-wrap {
    flex: 1; min-height: 0; align-items: stretch;
  }

  body.input-focus .composer-input,
  body.hot-mic-compose .composer-input {
    flex: 1; min-height: 0; height: 100% !important;
    max-height: none; font-size: 16px; line-height: 1.5;
    padding: 12px 8px 12px 0;
  }

  /* Keyboard open */
  body.keyboard-open .session-meta { display: none; }
  body.keyboard-open .main { padding-top: 4px; }
  body.keyboard-open .pane-wrap { padding: 8px 10px; }
  body.keyboard-open .composer-shell { padding-top: 0; padding-bottom: 0; }
  body.keyboard-open.input-focus .main,
  body.keyboard-open.hot-mic-compose .main {
    flex: 0 0 22%;
    padding-top: 2px;
    padding-bottom: 2px;
  }
  body.keyboard-open.input-focus .composer-shell,
  body.keyboard-open.hot-mic-compose .composer-shell {
    flex: 1 1 auto;
    padding: 2px 10px calc(env(safe-area-inset-bottom) + var(--keyboard-bottom-inset, 8px) + 6px);
  }
  body.keyboard-open.input-focus .composer,
  body.keyboard-open.hot-mic-compose .composer {
    min-height: 0;
    height: 100%;
  }
  body.keyboard-open.input-focus .pane-wrap,
  body.keyboard-open.hot-mic-compose .pane-wrap {
    padding: 6px 10px;
  }

  function describeSpeechError(err) {
    if (!err) return 'unknown error';
    if (typeof err === 'string') return err;
    if (err.name && err.message) return err.name + ': ' + err.message;
    if (err.message) return err.message;
    if (err.name) return err.name;

  function stripAnsi(text) {
    return (text || '').replace(/\x1B\[[0-9;?]*[ -/]*[@-~]/g, '');
  }

  function sanitizeForSpeech(text) {
    return stripAnsi(text || '')
      .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g, ' ')
      .replace(/\r/g, '')
      .replace(/[ \t]+/g, ' ')
      .replace(/\n{3,}/g, '\n\n')
      .trim();
  }

  function stripPromptPrefix(line) {
    return (line || '')
      .replace(/^\s*(?:›|\$|❯)\s*/, '')
      .replace(/^\s*[\w.-]+@[\w.-]+(?::[^\s]+)?[$#]\s*/, '')
      .replace(/^\s*(?:~|\/)[^%#$\n]*[%#$]\s*/, '');
  }

  function normalizeSpeechLine(line) {
    return stripPromptPrefix(line)
      .replace(/\s+/g, ' ')
      .trim();
  }

  function normalizeSpeechText(text) {
    return sanitizeForSpeech(text)
      .split('\n')
      .map(normalizeSpeechLine)
      .filter(Boolean)
      .join(' ')
      .trim();
  }

  function splitForSpeech(text) {
    var remaining = (text || '').trim();
    var chunks = [];
    var maxLen = 1800;

    while (remaining.length > maxLen) {
      var cut = remaining.lastIndexOf('\n\n', maxLen);
      if (cut < 300) {
        cut = remaining.lastIndexOf('\n', maxLen);
      }
      if (cut < 300) {
        cut = remaining.lastIndexOf('. ', maxLen);
      }
      if (cut < 300) {
        cut = maxLen;
      }

      var chunk = remaining.slice(0, cut).trim();
      if (chunk) {
        chunks.push(chunk);
      }
      remaining = remaining.slice(cut).trim();
    }

    if (remaining) {
      chunks.push(remaining);
    }

    return chunks;
  }

  function paneTextDelta(previousText, currentText) {
    var prev = previousText || '';
    var next = currentText || '';
    if (!prev) return next;
    if (next.indexOf(prev) === 0) {
      return next.slice(prev.length);
    }

    var prevLines = prev.split('\n');
    var nextLines = next.split('\n');
    var maxOverlap = Math.min(prevLines.length, nextLines.length);
    for (var overlap = maxOverlap; overlap > 0; overlap -= 1) {
      var matches = true;
      for (var j = 0; j < overlap; j += 1) {
        if (prevLines[prevLines.length - overlap + j] !== nextLines[j]) {
          matches = false;
          break;
        }
      }
      if (matches) {
        return nextLines.slice(overlap).join('\n');
      }
    }

    var i = 0;
    while (i < prevLines.length && i < nextLines.length && prevLines[i] === nextLines[i]) {
      i += 1;
    }
    return nextLines.slice(i).join('\n');

  function isUserSpeechBlock(block) {
    return (block || '').trim().indexOf('›') === 0;

  function isImageSpeechBlock(block) {
    return /^\[Image #[0-9]+\]$/i.test((block || '').trim());

  function isDividerSpeechBlock(block) {
    return /^[\u2500-\u257f\u2014\u2015\-_=]{8,}$/.test((block || '').trim());

  function isFooterSpeechBlock(block) {
    var normalized = normalizeSpeechText(block);

  function isProgressSpeechBlock(block) {
    var normalized = normalizeSpeechText(block);
    if (!normalized) return false;
    if (/^•\s+i(?:'m|’m| am| have|’ve|'ve)\b/i.test(normalized)) {

    if (/\bworking\b/i.test(normalized) && /\besc(?:ape)? to interrupt\b/i.test(normalized)) {

  function extractSpeechReplyFromBlocks(blocks, userIndex) {
    if (userIndex < 0 || !blocks.length) {

    var segment = [];
    for (var j = userIndex + 1; j < blocks.length; j += 1) {
      var block = blocks[j];
      if (isUserSpeechBlock(block) || isFooterSpeechBlock(block)) {

      if (isImageSpeechBlock(block) || isDividerSpeechBlock(block)) {

      segment.push(block);

    if (!segment.length) {
      return { text: '' };

    var finalStart = 0;
    for (var k = 0; k < segment.length; k += 1) {

    var finalBlocks = segment.slice(finalStart).filter(function(block) {
      return !isProgressSpeechBlock(block);

    if (!finalBlocks.length) {
      return { text: '' };
    }

    return {
      text: normalizeSpeechText(finalBlocks.join('\n\n')).replace(/^[\s:;,.!?\-•]+/, '').trim()

  function extractLeadingShortSpeechReply(blocks, normalizedSubmitted) {
    if (!blocks.length) {
      return { text: '' };

    for (var i = blocks.length - 1; i >= 0; i -= 1) {
      var block = blocks[i];
      if (isUserSpeechBlock(block) || isFooterSpeechBlock(block)) {
        continue;
      }
      if (isImageSpeechBlock(block) || isDividerSpeechBlock(block)) {
        continue;
      }
      if (isProgressSpeechBlock(block)) {
        continue;
      }

      var text = normalizeSpeechText(block).replace(/^[\s:;,.!?\-•]+/, '').trim();

        return j;
      }
    }
    return -1;
  }

  function extractSpeechReplyInfo(currentText, submittedText, baseText) {
    var normalizedSubmitted = normalizeSpeechText(submittedText);
    var deltaText = paneTextDelta(baseText || '', currentText || '');
    var deltaBlocks = splitSpeechBlocks(deltaText);

    if (deltaBlocks.length) {
      var deltaUserIndex = findMatchingUserBlockIndex(deltaBlocks, normalizedSubmitted, false);
      if (deltaUserIndex < 0) {
        var shortReply = extractLeadingShortSpeechReply(deltaBlocks, normalizedSubmitted);
        if (shortReply.text) {
          return shortReply;
        }
        deltaUserIndex = findMatchingUserBlockIndex(deltaBlocks, '', false);
      }
      var deltaReply = extractSpeechReplyFromBlocks(deltaBlocks, deltaUserIndex);
      if (deltaReply.text) {
        return deltaReply;
      }
    }

    var blocks = splitSpeechBlocks(currentText);
    var userIndex = -1;

    if (!normalizedSubmitted || !blocks.length) {
      return { text: '' };
    }

    userIndex = findMatchingUserBlockIndex(blocks, normalizedSubmitted, true);

    if (userIndex < 0) {
      return { text: '' };
    }

    return extractSpeechReplyFromBlocks(blocks, userIndex);
  }

  function extractSpeechDelta(spokenText, replyText) {
    var spoken = normalizeSpeechText(spokenText);
    var reply = normalizeSpeechText(replyText);
    if (!reply) return '';
    if (!spoken) return reply;
    if (reply === spoken) return '';
    if (reply.indexOf(spoken) === 0) {
      return reply.slice(spoken.length).replace(/^[\s:;,.!?\-•]+/, '').trim();
    }
    return reply;
  }

  function extractBargeKeyword(text) {
    var normalized = normalizeSpeechText(text || '').toLowerCase();
    if (!normalized) return '';
    var match = normalized.match(BARGE_KEYWORD_PATTERN);
    return match ? match[1] : '';
  }

  function resetSpeechReplyTracking() {
    clearTimeout(speechTimer);
    speechTimer = null;
    speechReplySubmittedText = '';
    speechReplyBaseText = '';
    speechReplyLatestText = '';
    speechReplySpokenText = '';
    speechAwaitingReply = false;
  }

  function shouldMonitorBargeIn() {
    return hotMicEnabled && (
      speechAwaitingReply ||
      speechPlaybackActive ||
      speechQueue.length
    );
  }

  function stopBargeInMonitor() {
    clearTimeout(bargeInStartTimer);
    bargeInStartTimer = null;
    clearInterval(bargeInMonitorTimer);
    bargeInMonitorTimer = null;
    var wasBargeRecognition = bargeRecognitionMode;
    bargeRecognitionMode = false;
    bargeInVoiceFrames = 0;
    bargeInNoiseFloor = 0.008;
    bargeInTimeData = null;
    if (bargeInSource) {
      try {
        bargeInSource.disconnect();
      } catch (err) {}
      bargeInSource = null;
    }
    if (bargeInStream) {
      bargeInStream.getTracks().forEach(function(track) {
        try {
          track.stop();
        } catch (err) {}
      });
      bargeInStream = null;
    }
    if (bargeInAudioContext) {
      try {
        bargeInAudioContext.close();
      } catch (err) {}
      bargeInAudioContext = null;
    }
    bargeInAnalyser = null;
    if (wasBargeRecognition && recognitionListening) {
      stopRecognition();
    }
  }

  function sampleBargeInLevel() {
    if (!bargeInAnalyser || !bargeInTimeData) {
      return 0;
    }
    bargeInAnalyser.getByteTimeDomainData(bargeInTimeData);
    var sumSquares = 0;
    for (var i = 0; i < bargeInTimeData.length; i += 1) {
      var normalized = (bargeInTimeData[i] - 128) / 128;
      sumSquares += normalized * normalized;
    }
    return Math.sqrt(sumSquares / bargeInTimeData.length);
  }

  function shouldInterruptTmuxForBargeIn() {
    return hotMicEnabled && (
      speechAwaitingReply ||
      speechPlaybackActive ||
      speechQueue.length
    );
  }

  function triggerBargeIn() {
    if (!hotMicEnabled) return;

    var shouldInterruptTmux = shouldInterruptTmuxForBargeIn();
    speechHardStopped = true;
    hotMicAwaitingFreshUtterance = true;
    hotMicIgnoreResultsUntil = Date.now() + HOT_MIC_BARGE_RESET_DELAY;
    resetSpeechReplyTracking();
    stopBargeInMonitor();
    stopSpeechPlayback();
    recognitionPausedForSpeech = false;
    clearTimeout(recognitionRestartTimer);
    recognitionRestartTimer = null;
    pendingSubmittedText = '';
    pendingInputSnapshot = '';
    hotMicPendingVoiceCommand = null;
    recognitionBaseText = '';
    input.value = '';
    renderImagePreviews();
    document.body.classList.remove('input-focus');
    setHotMicComposerView(true);
    autoResize();

    function restartAfterBarge(delay) {
      recognitionPausedForSpeech = false;
      scheduleRecognitionRestart(delay);
    }

    if (shouldInterruptTmux) {
      restartAfterBarge(700);
      postJson(sessionApi('/api/send-keys/'), { key: 'Escape' })
        .then(function() {
          setTimeout(function() { fetchPane(true); }, 120);
          restartAfterBarge(260);
        })
        .catch(function() {
          restartAfterBarge(420);
        });
    } else {
      restartAfterBarge(220);
    }

    showStatus('Hot mic listening');
  }

  async function startBargeInMonitor() {
    if (bargeRecognitionMode || !shouldMonitorBargeIn() || recognitionListening) {
      return;
    }
    if (!recognition) {
      return;
    }
    bargeRecognitionMode = true;
    postMobileLog('barge recognition armed for keywords', 'mic');
    try {
      recognition.start();
    } catch (err) {
      bargeRecognitionMode = false;
    }
  }

  function scheduleBargeInMonitorStart(delay) {
    clearTimeout(bargeInStartTimer);
    bargeInStartTimer = null;
    if (!shouldMonitorBargeIn()) {
      return;
    }
    bargeInStartTimer = setTimeout(function() {
      startBargeInMonitor();
    }, typeof delay === 'number' ? delay : BARGE_IN_MONITOR_DELAY);
  }

  function refreshMicButtonState() {
    if (!hotMicBtn) return;
    hotMicBtn.classList.toggle('hot-mic', hotMicEnabled);
    hotMicBtn.style.background = hotMicEnabled ? '#FEF2F2' : '';
    hotMicBtn.style.borderColor = hotMicEnabled ? 'rgba(220, 38, 38, 0.5)' : '';
    hotMicBtn.style.color = hotMicEnabled ? '#DC2626' : '';
    hotMicBtn.style.boxShadow = hotMicEnabled
      ? '0 0 0 2px rgba(220, 38, 38, 0.12), 0 0 16px rgba(220, 38, 38, 0.15)'
      : '';
    var micIcon = hotMicBtn.querySelector('.btn-icon');

    hotMicBtn.setAttribute(

    );
  }

  function scheduleRecognitionRestart(delay) {
    clearTimeout(recognitionRestartTimer);
    recognitionRestartTimer = setTimeout(function() {
      if (hotMicEnabled && !recognitionListening && !recognitionPausedForSpeech) {
        startRecognition();
      }
    }, typeof delay === 'number' ? delay : 250);
  }

  function startRecognition() {
    if (!recognition || recognitionListening) return;
    bargeRecognitionMode = false;
    stopBargeInMonitor();
    clearTimeout(recognitionRestartTimer);
    recognitionRestartTimer = null;
    try {
      recognition.start();
    } catch (err) {}
  }

  function stopRecognition() {
    if (!recognition || !recognitionListening) return;
    try {
      recognition.stop();
    } catch (err) {}
  }

  function pauseRecognitionForSpeech() {
    if (!hotMicEnabled) return;
    recognitionPausedForSpeech = true;
    clearTimeout(recognitionRestartTimer);
    recognitionRestartTimer = null;
    scheduleBargeInMonitorStart();
    if (recognitionListening) {
      stopRecognition();
    }
  }

  function resumeRecognitionAfterSpeech() {
    if (!hotMicEnabled) return;
    stopBargeInMonitor();
    speechPlaybackActive = false;
    recognitionPausedForSpeech = false;
    setHotMicComposerView(true);
    scheduleRecognitionRestart(220);
  }

  function scheduleSpeechContinuationCheck(delay) {
    clearTimeout(speechTimer);
    speechTimer = setTimeout(function() {
      checkForReplyContinuation();
    }, typeof delay === 'number' ? delay : SPEECH_FOLLOWUP_DELAY);
  }

  function stopSpeechPlayback() {
    clearTimeout(speechTimer);
    speechTimer = null;
    speechQueue = [];
    speechPlaybackActive = false;
    speechPlaybackToken += 1;
    if (replyAudio) {
      resetReplyAudioElement(true);
    }
    if ('speechSynthesis' in window) {
      try {
        window.speechSynthesis.cancel();
      } catch (err) {}
    }
  }

  function refreshSpeechVoice() {
    if (!('speechSynthesis' in window)) return;
    var voices = window.speechSynthesis.getVoices();
    if (!voices || !voices.length) {
      speechVoice = null;
      return;
    }

    var language = (navigator.language || 'en-US').toLowerCase();
    speechVoice = voices.find(function(voice) {
      return (voice.lang || '').toLowerCase() === language;
    }) || voices.find(function(voice) {
      return language.indexOf((voice.lang || '').toLowerCase().split('-')[0]) === 0;
    }) || voices.find(function(voice) {
      return voice.default;
    }) || voices[0];
  }

  function primeSpeechSynthesis() {
    if (speechPrimed) return;
    try {
      if (replyAudio) {
        replyAudio.setAttribute('playsinline', '');
        replyAudio.setAttribute('preload', 'auto');
        replyAudio.playsInline = true;
      }
      speechPrimed = true;
    } catch (err) {
      speechPrimed = false;
    }
  }

  function cleanupReplyAudioUnlock() {
    if (!replyAudio) return;
    try {
      replyAudio.pause();
    } catch (err) {}
    try {
      replyAudio.currentTime = 0;
    } catch (err) {}
    try {
      replyAudio.muted = false;
    } catch (err) {}
    try {
      replyAudio.removeAttribute('src');
      replyAudio.load();
    } catch (err) {}
  }

  function resetReplyAudioElement(clearSrc) {
    if (!replyAudio) return;
    replyAudio.onended = null;
    replyAudio.onerror = null;
    replyAudio.oncanplay = null;
    replyAudio.onloadedmetadata = null;
    try {
      replyAudio.pause();
    } catch (err) {}
    try {
      replyAudio.currentTime = 0;
    } catch (err) {}
    try {
      replyAudio.muted = false;
    } catch (err) {}
    if (clearSrc) {
      try {
        replyAudio.removeAttribute('src');
        replyAudio.load();
      } catch (err) {}
    }
  }

  function unlockReplyAudio() {
    primeSpeechSynthesis();
    if (!replyAudio) {
      return Promise.resolve(false);
    }
    if (replyAudioUnlocked) {
      return Promise.resolve(true);
    }
    if (replyAudioUnlocking) {
      return Promise.resolve(false);
    }

    replyAudioUnlocking = true;
    try {
      replyAudio.muted = true;
      replyAudio.src = SILENT_AUDIO_DATA_URI;
      replyAudio.load();
      var playPromise = replyAudio.play();

      if (playPromise && typeof playPromise.then === 'function') {
        return playPromise.then(function() {
          replyAudioUnlocked = true;
          replyAudioUnlocking = false;
          postMobileLog('reply audio unlocked', 'audio');
          cleanupReplyAudioUnlock();
          return true;
        }).catch(function(err) {
          replyAudioUnlocking = false;
          postMobileLog('reply audio unlock failed: ' + describeSpeechError(err), 'audio');
          cleanupReplyAudioUnlock();
          return false;
        });
      }

      replyAudioUnlocked = true;
      replyAudioUnlocking = false;
      postMobileLog('reply audio unlocked without promise', 'audio');
      cleanupReplyAudioUnlock();
      return Promise.resolve(true);
    } catch (err) {
      replyAudioUnlocking = false;
      postMobileLog('reply audio unlock threw: ' + describeSpeechError(err), 'audio');
      cleanupReplyAudioUnlock();
      return Promise.resolve(false);
    }
  }

  async function requestServerSpeechAsset(text) {
    var res = await fetch(sessionApi('/api/tts-file/'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text })
    });
    var payload = {};
    try {
      payload = await res.json();
    } catch (err) {}
    if (!res.ok) {
      throw new Error(payload && payload.error ? payload.error : ('HTTP ' + res.status));
    }
    if (!payload || !payload.url) {
      throw new Error('Speech audio URL missing');
    }
    return payload;
  }

  function startServerSpeechPlayback(url, activeToken, options) {
    var allowWithoutHotMic = !!(options && options.allowWithoutHotMic);
    var retryAfterUnlock = !!(options && options.retryAfterUnlock);
    if (!replyAudio) {
      debugSpeech('Audio element unavailable');
      speechPlaybackActive = false;
      playNextSpeechChunk({ allowWithoutHotMic: allowWithoutHotMic });
      return;
    }

    var settled = false;
    function finish(message) {
      if (settled || activeToken !== speechPlaybackToken) return;
      settled = true;
      resetReplyAudioElement(false);
      debugSpeech(message);
      speechPlaybackActive = false;
      playNextSpeechChunk({ allowWithoutHotMic: allowWithoutHotMic });
    }

    var playbackUrl = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'v=' + Date.now();
    var playAttempted = false;
    var playReadyTimer = null;

    function attemptPlay() {
      if (playAttempted || settled || activeToken !== speechPlaybackToken) return;
      playAttempted = true;
      clearTimeout(playReadyTimer);
      playReadyTimer = null;
      try {
        var playPromise = replyAudio.play();
        if (playPromise && typeof playPromise.then === 'function') {
          playPromise.then(function() {
            if (settled || activeToken !== speechPlaybackToken) return;
            debugSpeech('Voice playback started');
          }).catch(function(err) {
            var errorText = describeSpeechError(err);
            if (retryAfterUnlock &&
                /NotAllowedError/i.test(errorText) &&
                !replyAudioUnlocked &&
                activeToken === speechPlaybackToken) {
              unlockReplyAudio().then(function(unlocked) {
                if (activeToken !== speechPlaybackToken) return;
                if (unlocked) {
                  startServerSpeechPlayback(url, activeToken, {
                    allowWithoutHotMic: allowWithoutHotMic,
                    retryAfterUnlock: false
                  });
                  return;
                }
                finish('Voice play blocked: ' + errorText);
              });
              return;
            }
            finish('Voice play blocked: ' + errorText);
          });
          return;
        }
        debugSpeech('Voice playback started');
      } catch (err) {
        finish('Voice play blocked: ' + describeSpeechError(err));
      }
    }

    replyAudio.onended = function() {
      clearTimeout(playReadyTimer);
      playReadyTimer = null;
      finish('Voice playback ended');
    };
    replyAudio.onerror = function() {
      clearTimeout(playReadyTimer);
      playReadyTimer = null;
      finish('Voice playback error: audio element error');
    };
    replyAudio.oncanplay = attemptPlay;
    replyAudio.onloadedmetadata = function() {
      if (replyAudio.readyState >= 1) {
        attemptPlay();
      }
    };

    try {
      resetReplyAudioElement(true);
      replyAudio.src = playbackUrl;
      replyAudio.load();
      if (replyAudio.readyState >= 2) {
        attemptPlay();
      } else {
        playReadyTimer = setTimeout(function() {
          attemptPlay();
        }, 900);
      }
    } catch (err) {
      clearTimeout(playReadyTimer);
      playReadyTimer = null;
      finish('Voice play blocked: ' + describeSpeechError(err));
    }
  }

  async function playNextSpeechChunk(options) {
    var allowWithoutHotMic = !!(options && options.allowWithoutHotMic);
    if (speechHardStopped && !allowWithoutHotMic) {
      stopSpeechPlayback();
      return;
    }
    if (!hotMicEnabled && !allowWithoutHotMic) {
      stopSpeechPlayback();
      return;
    }

    if (!speechQueue.length) {
      speechPlaybackActive = false;
      if (speechAwaitingReply) {
        scheduleSpeechContinuationCheck();
      } else {
        resumeRecognitionAfterSpeech();
      }
      return;
    }

    speechPlaybackActive = true;
    pauseRecognitionForSpeech();
    var activeToken = speechPlaybackToken;
    var speechText = speechQueue.shift();
    if (!speechText) {
      speechPlaybackActive = false;
      playNextSpeechChunk({ allowWithoutHotMic: allowWithoutHotMic });
      return;
    }

    try {
      debugSpeech('Generating voice audio');
      var asset = await requestServerSpeechAsset(speechText);
      if (activeToken !== speechPlaybackToken) {
        return;
      }
      debugSpeech('Voice audio received');
      startServerSpeechPlayback(asset.url, activeToken, {
        allowWithoutHotMic: allowWithoutHotMic,
        retryAfterUnlock: true
      });
    } catch (err) {
      if (activeToken !== speechPlaybackToken) {
        return;
      }
      debugSpeech('Voice playback error: ' + describeSpeechError(err));
      speechPlaybackActive = false;
      playNextSpeechChunk({ allowWithoutHotMic: allowWithoutHotMic });
    }
  }

  function speakText(text) {
    if (!text) return;
    if (speechHardStopped) return;

    var chunks = splitForSpeech(text);
    if (!chunks.length) return;

    Array.prototype.push.apply(speechQueue, chunks);
    if (!speechPlaybackActive) {
      playNextSpeechChunk();
    }
  }

  function speakPendingReplyDelta() {
    if (!hotMicEnabled || !speechAwaitingReply) return false;
    if (speechPlaybackActive || speechQueue.length) return false;

    var replyInfo = extractSpeechReplyInfo(
      speechReplyLatestText,
      speechReplySubmittedText,
      speechReplyBaseText
    );
    var deltaText = extractSpeechDelta(speechReplySpokenText, replyInfo.text);
    if (!deltaText) {
      return false;
    }

    clearTimeout(speechTimer);
    speechTimer = null;
    speechReplySpokenText = replyInfo.text;
    speakText(deltaText);
    return true;
  }

  async function checkForReplyContinuation() {
    clearTimeout(speechTimer);
    speechTimer = null;

    if (speechHardStopped) {
      resetSpeechReplyTracking();
      resumeRecognitionAfterSpeech();
      return;
    }

    if (!hotMicEnabled || !speechAwaitingReply) {
      return;
    }

    if (speechPlaybackActive || speechQueue.length) {
      return;
    }

    await fetchPane(true);
    if (!hotMicEnabled || !speechAwaitingReply) {
      return;
    }

    if (speechPlaybackActive || speechQueue.length) {
      return;
    }

    if (speakPendingReplyDelta()) {
      return;
    }

    resetSpeechReplyTracking();
    resumeRecognitionAfterSpeech();
  }

  function scheduleSpeechFromPane(nextText) {
    if (speechHardStopped) return;
    if (!hotMicEnabled || !speechAwaitingReply) return;
    speechReplyLatestText = nextText || '';
    speakPendingReplyDelta();
  }

  function scheduleHotMicSend() {
    if (!hotMicEnabled) return;
    clearTimeout(hotMicSendTimer);
    hotMicSendTimer = setTimeout(function() {
      if (!hotMicEnabled) return;
      if (hotMicPendingVoiceCommand) {
        runVoiceToolbarCommand(hotMicPendingVoiceCommand);
        return;
      }
      if (!input.value.trim()) return;
      sendText(true);
    }, HOT_MIC_SILENCE_DELAY);
  }

  function setHotMicEnabled(enabled) {
    if (enabled && (!SpeechRecognitionCtor || !recognition)) {
      hotMicEnabled = false;
      suppressInputFocusAfterMicStop = false;
      hotMicComposerView = false;
      stopBargeInMonitor();
      syncHotMicComposerView();
      refreshMicButtonState();
      showStatus('Speech recognition unavailable here');
      return;
    }

    hotMicEnabled = enabled;
    suppressInputFocusAfterMicStop = false;
    stopBargeInMonitor();
    clearTimeout(hotMicSendTimer);
    hotMicSendTimer = null;
    clearTimeout(recognitionRestartTimer);
    recognitionRestartTimer = null;

    if (enabled) {
      speechHardStopped = false;
      hotMicPendingVoiceCommand = null;
      hotMicAwaitingFreshUtterance = false;
      hotMicIgnoreResultsUntil = 0;
      resetSpeechReplyTracking();
      recognitionPausedForSpeech = false;
      primeSpeechSynthesis();
      setHotMicComposerView(true);
      if (document.activeElement === input) {
        input.blur();
      }
      document.body.classList.remove('input-focus');
      syncViewportHeight();
      showStatus('Hot mic on');
      startRecognition();
    } else {
      speechHardStopped = false;
      hotMicPendingVoiceCommand = null;
      hotMicAwaitingFreshUtterance = false;
      hotMicIgnoreResultsUntil = 0;
      suppressInputFocusAfterMicStop = true;
      stopSpeechPlayback();
      resetSpeechReplyTracking();
      recognitionPausedForSpeech = false;
      document.body.classList.remove('input-focus');
      setHotMicComposerView(false);
      scrollPane('end');
      if (document.activeElement === input) {
        input.blur();
      }
      stopRecognition();
      showStatus('Hot mic off');
    }

    refreshMicButtonState();
  }

  function handleMicButtonTap() {
    setHotMicEnabled(!hotMicEnabled);
  }

  function activateMic(event) {
    if (event && event.cancelable) {
      event.preventDefault();
    }
    var now = Date.now();
    if (now - lastMicActivationAt < 320) {
      postMobileLog('activateMic ignored as duplicate tap', 'mic');
      return;
    }
    lastMicActivationAt = now;
    postMobileLog('activateMic toggling hot mic to ' + (!hotMicEnabled), 'mic');
    unlockReplyAudio();
    handleMicButtonTap();

  function setControlsCollapsed(collapsed) {
    if (!controlsShell || !controlsToggle) return;
    controlsShell.classList.toggle('collapsed', collapsed);
    controlsToggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
    controlsToggle.setAttribute('aria-label', collapsed ? 'Expand controls' : 'Collapse controls');
    try {
      localStorage.setItem('codex-mobile-controls-collapsed', collapsed ? '1' : '0');
    } catch (err) {}
    syncViewportHeight();
  }

  function formatPathTail(path) {
    if (!path) return 'No working directory';
    var parts = path.split('/').filter(Boolean);
    if (!parts.length) return path;
    var tail = parts.slice(-2).join('/');
    return parts.length > 2 ? '…/' + tail : tail;
  }

  function linkifyText(text) {
    var fragment = document.createDocumentFragment();
    var pattern = /(https?:\/\/[^\s<>"']+)/g;
    var lastIndex = 0;
    var match;

    while ((match = pattern.exec(text)) !== null) {
      if (match.index > lastIndex) {
        fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
      }
      var href = match[1];
      var link = document.createElement('a');
      link.href = href;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = href;
      link.style.color = 'inherit';
      link.style.textDecoration = 'underline';
      fragment.appendChild(link);
      lastIndex = match.index + href.length;
    }

    if (lastIndex < text.length) {
      fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
    }

    return fragment;
  }

  function renderPaneText(text) {
    pane.innerHTML = '';

    if (!text) {
      pane.textContent = 'Waiting for terminal output…';
      pane.classList.add('pane-empty');
      return;
    }

    pane.classList.remove('pane-empty');

    var blocks = text.split(/\n{2,}/);
    blocks.forEach(function(block) {
      var el = document.createElement('div');
      el.className = 'pane-block';
      if (block.trim().startsWith('›')) {
        el.classList.add('user');
      }
      el.appendChild(linkifyText(block));
      pane.appendChild(el);
    });
  }

  function normalizeMatchText(text) {
    return (text || '')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function insertAssetUrls(assets) {
    if (!assets || !assets.length) return;
    var refs = assets
      .map(function(asset) { return window.location.origin + asset.url; })
      .join('\n');
    input.value = input.value.trim()
      ? input.value.replace(/\s+$/, '') + '\n' + refs
      : refs;
    renderImagePreviews();
    autoResize();
    input.focus();
  }

  function insertComposerText(text) {
    if (!text) return;
    input.value = input.value.trim()
      ? input.value.replace(/\s+$/, '') + '\n' + text
      : text;
    renderImagePreviews();
    autoResize();
    input.focus();
  }

  function resolveAssetPublicUrl(asset) {
    if (asset && asset.url) {
      if (/^https?:\/\//i.test(asset.url)) {
        return asset.url;
      }
      return window.location.origin + asset.url;
    }
    return asset && asset.public_url ? asset.public_url : '';
  }

  function extractImageUrls(text) {
    var matches = (text || '').match(/https?:\/\/[^\s<>"']+\.(?:png|jpe?g|gif|webp|bmp)(?:\?[^\s<>"']*)?/gi) || [];
    var seen = Object.create(null);
    return matches.filter(function(url) {
      if (seen[url]) return false;
      seen[url] = true;
      return true;
    });
  }

  function removeImageUrl(url) {
    if (!url) return;
    var escaped = url.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var linePattern = new RegExp('(?:^|\\n)' + escaped + '(?=\\n|$)', 'g');
    input.value = input.value
      .replace(linePattern, '')
      .replace(/\n{3,}/g, '\n\n')
      .replace(/^\n+|\n+$/g, '');
    renderImagePreviews();
    autoResize();
    input.focus();
  }

      remove.setAttribute('aria-label', 'Remove image URL');
      remove.textContent = '×';
      remove.addEventListener('click', function() {

      card.appendChild(img);

  function triggerToolbarButton(button) {
    if (!button) return false;

  function normalizeVoiceCommand(text) {
    return normalizeSpeechText(text || '')
      .toLowerCase()
      .replace(/[^\w\s]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function voiceCommandTokens(text) {
    return normalizeVoiceCommand(text).split(' ').filter(Boolean);
  }

  function voiceCommandHasWord(tokens, word) {
    return tokens.indexOf(word) >= 0;
  }

  function voiceCommandHasAny(tokens, words) {
    for (var i = 0; i < words.length; i += 1) {
      if (voiceCommandHasWord(tokens, words[i])) {
        return true;
      }
    }
    return false;
  }

  function voiceCommandTokensWithin(tokens, allowed) {
    for (var i = 0; i < tokens.length; i += 1) {
      if (allowed.indexOf(tokens[i]) < 0) {
        return false;
      }
    }
    return true;
  }

  function detectVoiceToolbarCommand(text) {
    var tokens = voiceCommandTokens(text);
    if (!tokens.length) return null;
    var hasScreenshot = voiceCommandHasAny(tokens, ['screenshot', 'screen']);
    var hasWindow = voiceCommandHasWord(tokens, 'window');
    var hasPhoto = voiceCommandHasAny(tokens, ['photo', 'image', 'picture']);
    var hasClipboard = voiceCommandHasWord(tokens, 'clipboard');
    var hasPage = voiceCommandHasWord(tokens, 'page');
    var hasGo = voiceCommandHasWord(tokens, 'go');
    var hasUp = voiceCommandHasWord(tokens, 'up');
    var hasDown = voiceCommandHasWord(tokens, 'down');
    var hasBottom = voiceCommandHasWord(tokens, 'bottom');

    if (hasScreenshot && hasWindow &&
        voiceCommandTokensWithin(tokens, ['take', 'takes', 'window', 'screenshot', 'screen', 'capture'])) {
      return {
        label: 'Take Window Screenshot',
        run: function() { return triggerToolbarButton(windowShotBtn); }
      };
    }
    if (hasScreenshot &&
        voiceCommandTokensWithin(tokens, ['take', 'takes', 'screenshot', 'screen', 'desktop', 'capture'])) {
      return {
        label: 'Take Screenshot',
        run: function() { return triggerToolbarButton(screenShotBtn); }
      };
    }
    if (hasPhoto &&
        voiceCommandTokensWithin(tokens, ['add', 'upload', 'photo', 'image', 'picture'])) {
      return {
        label: 'Add Photo',
        run: function() { return triggerToolbarButton(imageBtn); }
      };
    }
    if (hasClipboard &&
        voiceCommandTokensWithin(tokens, ['show', 'paste', 'clipboard'])) {
      return {
        label: 'Show Clipboard',
        run: function() { return triggerToolbarButton(clipboardBtn); }
      };
    }
    if ((hasPage || hasGo) && hasUp &&
        voiceCommandTokensWithin(tokens, ['go', 'page', 'scroll', 'up'])) {
      return {
        label: 'Go Page Up',
        run: function() { return triggerToolbarButton(pageUpBtn); }
      };
    }
    if ((hasPage || hasGo) && hasDown &&
        voiceCommandTokensWithin(tokens, ['go', 'page', 'scroll', 'down'])) {
      return {
        label: 'Go Page Down',
        run: function() { return triggerToolbarButton(pageDownBtn); }
      };
    }
    if ((hasPage || hasGo || hasBottom) && hasBottom &&
        voiceCommandTokensWithin(tokens, ['go', 'page', 'scroll', 'bottom'])) {
      return {
        label: 'Page Bottom',
        run: function() { return triggerToolbarButton(pageEndBtn); }
      };
    }

    var normalized = tokens.join(' ');
    var commands = [
      {
        phrases: ['add photo', 'upload photo'],
        label: 'Add Photo',
        run: function() { return triggerToolbarButton(imageBtn); }
      },
      {
        phrases: ['take screenshot', 'take screen screenshot', 'desktop screenshot'],
        label: 'Take Screenshot',
        run: function() { return triggerToolbarButton(screenShotBtn); }
      },
      {
        phrases: ['take window screenshot', 'window screenshot'],
        label: 'Take Window Screenshot',
        run: function() { return triggerToolbarButton(windowShotBtn); }
      },
      {
        phrases: ['show clipboard', 'paste clipboard'],
        label: 'Show Clipboard',
        run: function() { return triggerToolbarButton(clipboardBtn); }
      },
      {
        phrases: ['go page up', 'page up'],
        label: 'Go Page Up',
        run: function() { return triggerToolbarButton(pageUpBtn); }
      },
      {
        phrases: ['go page down', 'page down'],
        label: 'Go Page Down',
        run: function() { return triggerToolbarButton(pageDownBtn); }
      },
      {
        phrases: ['page bottom', 'go page bottom', 'scroll bottom'],
        label: 'Page Bottom',
        run: function() { return triggerToolbarButton(pageEndBtn); }
      }
    ];
    for (var i = 0; i < commands.length; i += 1) {
      if (commands[i].phrases.indexOf(normalized) >= 0) {
        return commands[i];
      }
    }
    return null;
  }

  function runVoiceToolbarCommand(command) {
    if (!command || typeof command.run !== 'function') return;
    clearTimeout(hotMicSendTimer);
    hotMicSendTimer = null;
    hotMicPendingVoiceCommand = null;
    input.value = '';

    postMobileLog('voice command detected: ' + command.label, 'mic');

  function maybeClearPendingInput(nextText) {
    if (!pendingSubmittedText) return;

    var sent = normalizeMatchText(pendingSubmittedText);
    var paneText = normalizeMatchText(nextText);
    if (!sent || !paneText.includes(sent)) return;
    var snapshot = pendingInputSnapshot;

    pendingSubmittedText = '';
    pendingInputSnapshot = '';

    if (input.value === snapshot) {
      input.value = '';
      renderImagePreviews();
      autoResize();
      if (!hotMicEnabled) {
        input.focus();
      }
      return;
    }

    renderImagePreviews();
    autoResize();
  }

  async function fetchPane(forceStick) {
    try {
      var res = await fetch(sessionApi('/api/pane/') + '&lines=120', {
        cache: 'no-store'
      });
      var data = await res.json();
      if (!data.ok) {
        pane.textContent = 'Session not found. Go back and reopen it.';
        pane.classList.add('pane-empty');
        setUpdatedTime(null);
        return;
      }

      var nextText = data.text || '';
      var nextCursorY = typeof data.cursor_y === 'number' ? data.cursor_y : null;
      if (nextText !== lastText || nextCursorY !== lastCursorY) {
        renderPaneText(nextText);
        if (nextText !== lastText) {
          scheduleSpeechFromPane(nextText);
        }
        maybeClearPendingInput(nextText);
        lastText = nextText;
        lastCursorY = nextCursorY;
      }
      cwdLabel.textContent = formatPathTail(data.cwd || '');
      setUpdatedTime(data.updated);
      if (!hasLoadedOnce) {
        paneWrap.scrollTop = 0;
      }
      hasLoadedOnce = true;
    } catch (err) {
      showStatus('Connection issue');
    }
  }

  async function postJson(path, payload) {
    var res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    return res.ok;
  }

  async function runSteps(steps, label) {
    var ok = true;
    for (var i = 0; i < steps.length; i += 1) {
      var step = steps[i];
      if (step.key) {
        ok = await postJson(sessionApi('/api/send-keys/'), { key: step.key });
      } else if (typeof step.text === 'string') {
        ok = await postJson(sessionApi('/api/send-text/'), { text: step.text });
      }

      if (!ok) break;

      if (i < steps.length - 1) {
        await new Promise(function(resolve) { setTimeout(resolve, 60); });
      }
    }

    showStatus(ok ? 'Sent ' + label : 'Action failed');
    setTimeout(function() { fetchPane(true); }, 140);
    return ok;
  }

  async function sendKey(key) {
    await runSteps([{ key: key }], key);
  }

  function scrollPane(direction) {
    if (!paneWrap) return;
    if (direction === 'end') {
      paneWrap.scrollTo({
        top: paneWrap.scrollHeight,
        behavior: 'smooth'
      });
      return;
    }
    var amount = Math.max(120, Math.floor(paneWrap.clientHeight * 0.82));
    var delta = direction === 'up' ? -amount : amount;
    paneWrap.scrollBy({
      top: delta,
      behavior: 'smooth'
    });
  }

  async function sendText(withEnter) {
    var text = input.value;
    if (!text.trim()) {
      if (withEnter) return sendKey('Enter');
      return;
    }

    clearTimeout(hotMicSendTimer);
    hotMicSendTimer = null;

    var composedText = text;
    var ok = await postJson(sessionApi('/api/send-text/'), { text: composedText });
    if (ok && withEnter) {
      ok = await postJson(sessionApi('/api/send-keys/'), { key: 'Enter' });
    }

    showStatus(ok ? 'Sent to ' + SESSION_PRODUCT : 'Send failed');
    if (ok) {
      speechHardStopped = false;
      primeSpeechSynthesis();
      pendingSubmittedText = composedText;
      pendingInputSnapshot = input.value;
      if (hotMicEnabled) {
        stopSpeechPlayback();
        clearTimeout(speechTimer);
        speechTimer = null;
        recognitionPausedForSpeech = true;
        if (recognitionListening) {
          stopRecognition();
        }
        speechReplySubmittedText = composedText;
        speechReplyBaseText = lastText || '';
        speechReplyLatestText = lastText || '';
        speechReplySpokenText = '';
        speechAwaitingReply = true;
        scheduleBargeInMonitorStart();
      }
      if (hotMicEnabled) {
        input.value = '';
        renderImagePreviews();
        document.body.classList.remove('input-focus');
        setHotMicComposerView(true);
        autoResize();
        scrollPane('end');
      } else {
        input.value = '';
        renderImagePreviews();
        if (document.activeElement === input) {
          input.blur();
        }
        document.body.classList.remove('input-focus');
        autoResize();
        scrollPane('end');
      }
      setTimeout(function() { fetchPane(true); }, 120);
    }
  }

  function setMicState(listening) {

    refreshMicButtonState();

  function mergeTranscriptWithBaseText(baseText, transcript) {
    var base = baseText || '';
    var next = transcript || '';
    if (!base) return next;
    if (!next) return base;
    return /\s$/.test(base) ? base + next : base + ' ' + next;
  }

  function initMic() {
    if (!SpeechRecognitionCtor) return;

    recognition = new SpeechRecognitionCtor();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = navigator.language || 'en-US';

    recognition.onstart = function() {
      suppressInputFocusAfterMicStop = false;
      recognitionBaseText = hotMicAwaitingFreshUtterance ? '' : input.value;
      lastRecognitionResultAt = 0;
      setMicState(true);
      if (bargeRecognitionMode) {
        postMobileLog('barge recognition.onstart', 'mic');
        showStatus('Listening for stop, cancel, wait, hold, pause, or quiet');
        return;
      }
      if (hotMicEnabled) {
        setHotMicComposerView(true);
      }
      postMobileLog('recognition.onstart', 'mic');
      showStatus(hotMicEnabled ? 'Hot mic listening' : 'Listening…');
    };

    recognition.onresult = function(event) {
      var transcript = '';
      var hasFinalResult = false;
      for (var i = event.resultIndex; i < event.results.length; i += 1) {
        transcript += event.results[i][0].transcript;
        hasFinalResult = hasFinalResult || !!event.results[i].isFinal;
      }
      transcript = transcript.trim();

      if (bargeRecognitionMode) {
        var keyword = extractBargeKeyword(transcript);
        if (transcript) {
          postMobileLog('barge recognition.onresult ' + transcript, 'mic');
        }
        if (keyword) {
          postMobileLog('barge keyword detected: ' + keyword, 'mic');
          showStatus('Barge: ' + keyword);
          triggerBargeIn();
        }
        return;
      }

      if (speechAwaitingReply) {
        return;
      }
      if (hotMicEnabled && hotMicAwaitingFreshUtterance) {
        if (Date.now() < hotMicIgnoreResultsUntil) {
          if (transcript) {
            postMobileLog('recognition.onresult ignored after barge ' + transcript, 'mic');
          }
          return;
        }
        hotMicAwaitingFreshUtterance = false;
        hotMicIgnoreResultsUntil = 0;
        recognitionBaseText = '';
        input.value = '';
      }
      if (transcript) {
        lastRecognitionResultAt = Date.now();
        postMobileLog('recognition.onresult ' + transcript, 'mic');
        showStatus('Heard: ' + transcript);
      }
      if (hotMicEnabled && transcript) {
        var pendingCommand = detectVoiceToolbarCommand(transcript);
        if (pendingCommand) {
          hotMicPendingVoiceCommand = pendingCommand;
          input.value = '';
          renderImagePreviews();
          autoResize();
          showStatus('Voice command ready: ' + pendingCommand.label);
          scheduleHotMicSend();
          return;
        }
      }
      hotMicPendingVoiceCommand = null;
      input.value = mergeTranscriptWithBaseText(recognitionBaseText, transcript);
      if (hotMicEnabled) {
        setHotMicComposerView(true);
      }
      autoResize();
      if (hotMicEnabled) {
        scheduleHotMicSend();
      }
    };

    recognition.onerror = function(event) {
      setMicState(false);
      var errorCode = event && event.error ? event.error : '';
      if (bargeRecognitionMode) {
        postMobileLog('barge recognition.onerror ' + (errorCode || 'unknown'), 'mic');
        if (shouldMonitorBargeIn()) {
          bargeRecognitionMode = false;
          scheduleBargeInMonitorStart(220);
          showStatus('Listening for stop, cancel, wait, hold, pause, or quiet');
          return;
        }
      }
      postMobileLog('recognition.onerror ' + (errorCode || 'unknown'), 'mic');
      if (suppressInputFocusAfterMicStop) {
        showStatus('Hot mic off');
        return;
      }
      if (hotMicEnabled) {
        if (speechAwaitingReply) {
          scheduleBargeInMonitorStart();
          showStatus('Waiting for reply');
          return;
        }
        if (errorCode === 'not-allowed' || errorCode === 'service-not-allowed') {
          setHotMicEnabled(false);
          showStatus('Hot mic unavailable');
          return;
        }
        if (!recognitionPausedForSpeech) {
          scheduleRecognitionRestart(350);
        }
        if (errorCode === 'no-speech') {
          showStatus('Hot mic waiting');
        } else if (errorCode) {
          showStatus('Hot mic error: ' + errorCode);
        } else {
          showStatus('Hot mic listening');
        }
        return;
      }
      showStatus('Mic unavailable here');
      input.focus();
    };

    recognition.onend = function() {
      setMicState(false);
      if (bargeRecognitionMode) {
        postMobileLog('barge recognition.onend', 'mic');
        bargeRecognitionMode = false;
        if (shouldMonitorBargeIn()) {
          scheduleBargeInMonitorStart(220);
          showStatus('Listening for stop, cancel, wait, hold, pause, or quiet');
        }
        return;
      }
      postMobileLog(
        'recognition.onend awaiting=' + speechAwaitingReply +
        ' paused=' + recognitionPausedForSpeech +
        ' hot=' + hotMicEnabled +
        ' heard=' + !!lastRecognitionResultAt,
        'mic'
      );
      if (speechAwaitingReply) {
        scheduleBargeInMonitorStart();
        showStatus('Waiting for reply');
        return;
      }
      if (recognitionPausedForSpeech) {
        resumeRecognitionAfterSpeech();
        return;
      }
      if (suppressInputFocusAfterMicStop) {
        showStatus('Hot mic off');
        return;
      }
      if (hotMicEnabled) {
        if (!lastRecognitionResultAt) {
          showStatus('Hot mic ended before transcript');
        } else {
          showStatus('Hot mic listening');
        }
        scheduleRecognitionRestart(250);
        return;
      }
      input.focus();
      showStatus(input.value.trim()
        ? 'Transcript ready to send'
        : 'Mic stopped');
    };
  }

  }

  if (voiceCommandEditor) {
    loadVoiceCommandsNote();
    voiceCommandEditor.addEventListener('input', function() {
      try {
        localStorage.setItem(VOICE_COMMANDS_STORAGE_KEY, voiceCommandEditor.value);
      } catch (err) {}
    });
  }

  sendBtn.addEventListener('click', function() { sendText(true); });
  if (voiceCommandsBtn) {
    voiceCommandsBtn.addEventListener('click', function() {
      openVoiceCommandSheet();
    });
  }
  if (hotMicBtn) {
    hotMicBtn.addEventListener('pointerup', activateMic);
    hotMicBtn.addEventListener('click', function(event) {
      activateMic(event);
    });
  }
  input.addEventListener('focus', function() {
    document.body.classList.add('input-focus');
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
    syncViewportHeight();
    autoResize();
    setTimeout(function() {
      window.scrollTo(0, 0);
      document.documentElement.scrollTop = 0;
      document.body.scrollTop = 0;
    }, 50);
    setTimeout(function() {
      window.scrollTo(0, 0);
    }, 300);
  });
  var suppressBlurCollapse = false;

  input.addEventListener('blur', function() {
    window.setTimeout(function() {
      if (suppressBlurCollapse) {
        suppressBlurCollapse = false;
        input.focus();
        return;
      }
      if (document.activeElement !== input && !isKeyboardOpen()) {
        document.body.classList.remove('input-focus');
        syncViewportHeight();
        autoResize();
      }
    }, 120);
  });
  input.addEventListener('input', function() {
    renderImagePreviews();
    autoResize();
  });
  input.addEventListener('keydown', function(event) {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      sendText(true);
    }
  });

  window.addEventListener('resize', syncViewportHeight);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncViewportHeight);
    window.visualViewport.addEventListener('scroll', syncViewportHeight);
  }

  syncViewportHeight();
  input.placeholder = 'Message...';
  /* input.removeAttribute('placeholder'); */
  renderImagePreviews();
  autoResize();
  if ('speechSynthesis' in window && typeof window.speechSynthesis.onvoiceschanged !== 'undefined') {
    window.speechSynthesis.onvoiceschanged = refreshSpeechVoice;
  }
  refreshSpeechVoice();
  initMic();
  refreshMicButtonState();
  fetchPane(true);
  pollTimer = setInterval(function() { fetchPane(false); }, 1000);
  document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible') {
      fetchPane(true);
      if (hotMicEnabled && !recognitionListening && !recognitionPausedForSpeech) {
        scheduleRecognitionRestart(50);
      }
    }
  });
</script>

<!-- Variant switcher logic -->
<script>
(function() {
  var switcher = document.getElementById('variant-switcher');
  if (!switcher) return;
  var buttons = switcher.querySelectorAll('button');
  buttons.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var variant = btn.getAttribute('data-variant');
      document.body.className = variant + ' has-switcher';
      buttons.forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      // Sync the variant-b-mic button with hot-mic-btn state
      var mainMic = document.getElementById('hot-mic-btn');
      var inlineMic = document.querySelector('.variant-b-mic');
      if (mainMic && inlineMic) {
        inlineMic.classList.toggle('hot-mic', mainMic.classList.contains('hot-mic'));
      }
    });
  });
  // Make variant-b-mic click trigger the real hot-mic-btn
  var inlineMic = document.querySelector('.variant-b-mic');
  var mainMic = document.getElementById('hot-mic-btn');
  if (inlineMic && mainMic) {
    inlineMic.addEventListener('click', function(e) {
      e.preventDefault();
      mainMic.click();
      setTimeout(function() {
        inlineMic.classList.toggle('hot-mic', mainMic.classList.contains('hot-mic'));
      }, 50);
    });
  }
})();
</script>
